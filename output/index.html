/* --- 清单视图：按日期倒序，逐条列出 --- */
function viewCalList(y, m){
  var pre = (m<10?'0':'')+m;
  var days = Object.keys(S.records).filter(function(d){
    return d.slice(0,7) === y+'-'+pre && dayEntries(d).filter(function(e){ return hasContent(e); }).length;
  }).sort().reverse();

  if(!days.length)
    return '<div class="empty"><span class="e">·</span>这个月还没有记录<br>写下第一件事，就算开始了</div>';

  var s = '<div class="list">', total = 0;
  days.forEach(function(d){
    var list = dayEntries(d).filter(function(e){ return hasContent(e); });
    total += list.length;
    var wd = parseYmd(d).getDay();
    s += '<div class="lgroup">';
    s += '<div class="lhead">'
      +  '<span class="ld">'+(+d.slice(5,7))+' 月 '+(+d.slice(8,10))+' 日</span>'
      +  '<span class="lw">星期'+WD[wd]+'</span>'
      +  '<span class="ln">'+list.length+' 条</span></div>';

    list.forEach(function(e, i){
      var title = entryTitle(e);
      var emo = e.emotions || [];
      s += '<button class="litem" onclick="W.editEntry(\''+e.id+'\')">'
        +  '<span class="li-no">'+(i+1)+'</span>'
        +  '<span class="li-main">'
        +  '<span class="li-title'+(e.isDraft?' draft':'')+'">'+esc(title)+'</span>'
        +  '<span class="li-meta">';
      if(e.isDraft) s += '<span class="li-tag draft">草稿</span>';
      s += '<span class="mt">写了 '+filledCount(e)+' 栏</span>';
      if(emo.length){
        s += '<span class="li-dot"></span>';
        emo.slice(0,3).forEach(function(w){
          s += '<span class="chip">'+esc(w)+'</span>';
        });
      }
      s += '</span></span>'
        +  '<svg class="li-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'
        +  '</button>';
    });
    s += '</div>';
  });
  s += '</div>';

  var kw = monthKeywords(y, m);
  s += '<div class="overview">这个月，你有 '+days.length+' 天、共 '+total+' 条记录'
    +  (kw.length ? '<div class="kw">'+kw.map(function(w){ return '<span class="chip">'+esc(w)+'</span>'; }).join('')+'</div>' : '')
    +  '</div>';
  return s;
}

/* 条目在清单里显示什么：优先 ① 事件，其次 ①-A，再依次取第一个有内容的栏 */
function entryTitle(e){
  var order = ['event','reframe','thoughts','selfDiscovery','action','result','nextAction','nextResult'];
  for(var i=0;i<order.length;i++){
    var v = String(e[order[i]]||'').trim();
    if(v) return v.replace(/\s+/g,' ');
  }
  return '（还没写内容）';
}
function monthKeywords(y, m){
  var pre = (m<10?'0':'')+m, kw = {};
  Object.keys(S.records).forEach(function(d){
    if(d.slice(0,7) !== y+'-'+pre) return;
    doneEntries(d).forEach(function(e){
      (e.emotions||[]).forEach(function(w){ kw[w] = (kw[w]||0)+1; });
    });
  });
  return Object.keys(kw).sort(function(a,b){ return kw[b]-kw[a]; }).slice(0,6);
}

/* --- 月历视图 --- */
function viewCalMonth(y, m){
  var first = new Date(y, m-1, 1), start = (first.getDay()+6)%7;   // 周一为首列
  var days  = new Date(y, m, 0).getDate();
  var prevM = new Date(y, m-1, 0);
  var t = today();
  var cells = '', cnt = 0, kw = {};

  for(var i=start-1; i>=0; i--){
    cells += '<div class="cel dis"><span class="dd">'+(prevM.getDate()-i)+'</span></div>';
  }
  for(var d=1; d<=days; d++){
    var dObj = new Date(y, m-1, d);
    var ds = ymd(dObj);
    var list = doneEntries(ds);
    var mk = '', cls = 'cel', wmark = '';
    if(list.length){
      var sum = 0;
      list.forEach(function(e){
        sum += filledCount(e);
        (e.emotions||[]).forEach(function(w){ kw[w] = (kw[w]||0)+1; });
      });
      var avg = Math.round(sum / list.length);
      cnt++;
      mk = '<span class="mk l'+(avg<=2?2:avg<=4?3:4)+'"></span>';
      if(list.length > 1) mk += '<span class="cnum">'+list.length+'</span>';
    }
    /* 周复盘金色小点，标在该周周日：实心=已归档，空心=有内容未归档 */
    if(dObj.getDay() === 0){
      var rv = S.wk[mondayOf(ds)];
      if(rv && rv.done) wmark = '<span class="wmk" title="本周复盘已归档"></span>';
      else if(rv && (rv.focus.length || rv.links.length || rv.actions.length || Object.keys(rv.abs||{}).length))
        wmark = '<span class="wmk draft" title="本周复盘未归档"></span>';
    }
    if(ds===t) cls += ' today';
    if(ds>t) cls += ' dis';
    cells += '<div class="'+cls+'" '+(ds>t?'':'onclick="W.openDay(\''+ds+'\')"')+'>'
      +  '<span class="dd">'+d+'</span>'+mk+wmark+'</div>';
  }
  var kws = Object.keys(kw).sort(function(a,b){ return kw[b]-kw[a]; }).slice(0,6);

  var s = '<div class="calwrap">';
  s += '<div class="calgrid">'+['一','二','三','四','五','六','日'].map(function(w){
       return '<div class="wd">'+w+'</div>'; }).join('')+cells+'</div>';
  s += '<div class="overview">'
    +  (cnt ? '这个月，你有 '+cnt+' 天记录了自己' : '这个月还没有记录，随时可以开始')
    +  (kws.length ? '<div class="kw">'+kws.map(function(w){ return '<span class="chip">'+esc(w)+'</span>'; }).join('')+'</div>' : '')
    +  '</div></div>';
  return s;
}

/* ---------- §6 全局 W ---------- */
var W = {};

W.go = function(page, date){
  if(S.page==='record' && page!=='record'){
    W.flushDraft();
    S.entryId = null;          // 必须先清空，否则没写内容的条目会被当成"正在编辑"而漏删
    pruneEmpty(S.date);
    saveRecords();
  }
  if(date && date !== S.date) S.entryId = null;
  if(date) S.date = date;
  if(page==='record' && !S.date) S.date = today();
  if(page==='calendar' && !S.calYM) S.calYM = today().slice(0,7);
  if(page==='review'){ S.reviewWeek = mondayOf(today()); S.reviewYM = curYM(); S.wkAdv = false; }
  S.page = page;
  S.emoOpen = false;
  render();
};

/* 新建一条并进入编辑 */
W.newEntry = function(date){
  if(S.page==='record') W.flushDraft();
  if(date) S.date = date;
  if(!S.date) S.date = today();
  var e = newEntry(S.date);
  dayEntries(S.date).push(e);
  S.entryId = e.id;
  saveRecords();
  S.page = 'record';
  S.emoOpen = false;
  render();
};
/* 编辑指定条目（按 id 全局定位日期，供清单/详情页调用） */
W.editEntry = function(id){
  var d = locateEntry(id);
  if(!d) return;
  S.date = d;
  S.entryId = id;
  S.page = 'record';
  S.emoOpen = false;
  render();
};
/* 在当天条目间前后切换 */
W.swapEntry = function(dir){
  var l = dayEntries(S.date);
  var idx = -1, i;
  for(i=0;i<l.length;i++) if(l[i].id === S.entryId) idx = i;
  var nx = idx + dir;
  if(idx < 0 || nx < 0 || nx >= l.length) return;
  W.flushDraft();
  S.entryId = l[nx].id;
  S.emoOpen = false;
  render();
};

W.openDay = function(ds){
  S.entryId = null;
  if(dayEntries(ds).filter(function(e){ return hasContent(e); }).length){
    S.date = ds; S.page = 'detail'; render();
  }
  else W.go('record', ds);
};

/* 归档：把这一周的复盘「固定」下来（只读），并留下一份快照，便于日后回看 */
W.archiveReview = function(){
  var mon = S.reviewWeek || mondayOf(today());
  var r = reviewOf(mon);
  if(!(r.focus.length || r.links.length || r.actions.length || Object.keys(r.abs).length)){
    toast('这一周还没写内容，先写一点再归档');
    return;
  }
  var byId = {}; weekEntries(mon).forEach(function(e){ byId[e.id] = e; });
  r.snap = {
    at: Date.now(),
    week: mon,
    focus: r.focus.map(function(id){ var e = byId[id]; return e ? { date:e.date, title:entryTitle(e) } : null; }).filter(Boolean),
    links: r.links.map(function(l){
      var a = byId[l.a], b = byId[l.b];
      return { a:a?entryTitle(a):'（已删除）', b:b?entryTitle(b):'（已删除）',
               type:l.type, cause:l.cause||'', transfer:l.transfer||'' };
    }),
    abs: JSON.parse(JSON.stringify(r.abs || {})),
    actions: JSON.parse(JSON.stringify(r.actions || []))
  };
  r.done = true;
  r.doneAt = Date.now();
  r.updatedAt = r.doneAt;
  saveWk();
  toast('已归档：这一周的复盘固定下来了');
  var y = window.scrollY; render(); window.scrollTo({ top:y });
};

/* --- 记录页交互 --- */
W.onInput = function(ta){
  autoGrow(ta);
  var key = ta.getAttribute('data-key');
  var rec = curEntry();
  rec[key] = ta.value;
  if(key==='thoughts' && !rec.emotions) rec.emotions = [];
  var idx = FIELDS.map(function(f){ return f.key; }).indexOf(key);
  var dots = document.querySelectorAll('.dots i');
  if(dots[idx]) dots[idx].classList.toggle('on', ta.value.trim() !== '');
  var f = FIELDS.filter(function(x){ return x.key===key; })[0];
  if(f && f.splitCheck) W.checkSplit(ta);
  debounceDraft();
};
W.onFocus = function(ta){
  document.querySelectorAll('.fcard').forEach(function(c){
    c.classList.toggle('dim', c !== ta.closest('.fcard'));
    c.classList.toggle('focus', c === ta.closest('.fcard'));
  });
};
W.onBlur = function(){
  document.querySelectorAll('.fcard').forEach(function(c){ c.classList.remove('dim','focus'); });
};
W.checkSplit = function(ta){
  var key = ta.getAttribute('data-key');
  var f = FIELDS.filter(function(x){ return x.key===key; })[0];
  var box = document.getElementById('split-'+key);
  if(!f || !f.splitCheck || !box) return;
  var hits = splitHit(ta.value, f.splitCheck);
  if(hits.length){ box.innerHTML = esc(splitMsg(f.splitCheck, hits)); box.classList.add('show'); }
  else { box.classList.remove('show'); box.innerHTML = ''; }
};

/* --- 情绪标记：② 栏块区 / 快速行 / 弹窗 --- */
W.onThoughtInput = function(el){
  var rec = curEntry();
  rec.thoughts = thoughtText(el);
  var live = [];
  el.querySelectorAll('.tok').forEach(function(t){
    var w = t.getAttribute('data-w');
    if(live.indexOf(w) < 0) live.push(w);
  });
  syncEditEmpty(el);
  if(live.join('|') !== (rec.emotions || []).join('|')){
    rec.emotions = live;
    syncEmoExtra(rec);
  }
  debounceDraft();
};
W.onThoughtPaste = function(e){
  e.preventDefault();
  var text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
};
W.delTok = function(w){
  var rec = curEntry();
  var i = (rec.emotions || []).indexOf(w);
  if(i >= 0) rec.emotions.splice(i, 1);
  removeTok(w);
  saveRecords();
  syncEmoExtra(rec);
};
/* 快速行：点一下即加/删，不经过弹窗 */
W.emoQuick = function(el){
  var w = el.getAttribute('data-w');
  var rec = curEntry();
  if(!Array.isArray(rec.emotions)) rec.emotions = [];
  var i = rec.emotions.indexOf(w);
  if(i >= 0){ rec.emotions.splice(i, 1); removeTok(w); }
  else { rec.emotions.push(w); appendTok(w); }
  saveRecords();
  syncEmoExtra(rec);
};
/* 弹窗 */
W.openEmo = function(){
  var rec = curEntry();
  S.emoDraft = (rec.emotions || []).slice();
  S.emoQ = '';
  S.emoModal = true;
  renderEmoModal();
  document.body.style.overflow = 'hidden';
};
W.closeEmo = function(save){
  if(!save){
    var rec = curEntry();
    if((S.emoDraft || []).join('|') !== (rec.emotions || []).join('|')) toast('已取消本次勾选');
  }
  S.emoModal = false;
  renderEmoModal();
  document.body.style.overflow = '';
};
W.emoCell = function(el){
  var w = el.getAttribute('data-w');
  var i = S.emoDraft.indexOf(w);
  if(i >= 0) S.emoDraft.splice(i, 1); else S.emoDraft.push(w);
  el.classList.toggle('on', i < 0);
  emoFootSync();
};
W.emoQuery = function(q){
  S.emoQ = q;
  var kw = String(q || '').trim();
  document.querySelectorAll('.ecell').forEach(function(c){
    var hit = !kw || c.getAttribute('data-w').indexOf(kw) >= 0;
    c.classList.toggle('dim', !hit);
    c.classList.toggle('hit', !!kw && hit);
  });
};
W.emoClear = function(){
  S.emoDraft = [];
  document.querySelectorAll('.ecell').forEach(function(c){ c.classList.remove('on'); });
  emoFootSync();
};
W.emoCommit = function(){
  var rec = curEntry();
  if(!Array.isArray(rec.emotions)) rec.emotions = [];
  var want = (S.emoDraft || []).slice();
  var cur = rec.emotions.slice();
  cur.forEach(function(w){ if(want.indexOf(w) < 0) removeTok(w); });
  want.forEach(function(w){ if(cur.indexOf(w) < 0) appendTok(w); });
  rec.emotions = want;
  saveRecords();
  syncEmoExtra(rec);
  S.emoModal = false;
  renderEmoModal();
  document.body.style.overflow = '';
  toast(want.length ? ('已标记 '+want.length+' 个情绪') : '已清空情绪标记');
};

/* --- 草稿 --- */
var _dt;
function debounceDraft(){
  clearTimeout(_dt);
  _dt = setTimeout(function(){ W.flushDraft(); }, 800);
}
W.flushDraft = function(){
  var rec = S.entryId ? findEntry(S.date, S.entryId) : null;
  if(!rec) return;
  if(!hasContent(rec)) return;
  rec.updatedAt = Date.now();          // 已保存过的条目被编辑时，同样即时落盘
  if(!rec.createdAt) rec.createdAt = rec.updatedAt;
  saveRecords();
};

/* --- 保存 --- */
function collectFromDOM(){
  var rec = curEntry();
  document.querySelectorAll('.fcta').forEach(function(ta){
    if(ta.classList.contains('fcedit')) rec.thoughts = thoughtText(ta);
    else rec[ta.getAttribute('data-key')] = ta.value;
  });
  return rec;
}
W.save = function(andNext){
  var rec = collectFromDOM();
  if(!hasContent(rec)){ toast('先写下一点点，哪怕一句话'); return; }
  var miss = FIELDS.filter(function(f){ return f.required && !String(rec[f.key]||'').trim(); });
  if(miss.length){
    S.modal = {
      title:'就先这样保存吗？',
      body:'「'+miss.map(function(f){ return f.no+' '+f.label; }).join('」「')+'」还没写。<br>' +
           '这本书建议至少写下这几栏——哪怕一句话也算。当然，现在保存也不会丢，随时可以回来补。',
      btns:[{ text:'回去补上' }, { text:'就这样保存', pri:true, act:'forceSave' }]
    };
    renderModal();
    return;
  }
  doSave(rec, andNext);
};
function doSave(rec, andNext){
  rec.isDraft = false;
  rec.updatedAt = Date.now();
  if(!rec.createdAt) rec.createdAt = rec.updatedAt;
  pruneEmpty(S.date);
  saveRecords();
  S.fbDate = S.date;
  S.entryId = rec.id;
  if(andNext && canAddMore(S.date)){
    var e = newEntry(S.date);
    dayEntries(S.date).push(e);
    S.entryId = e.id;
    saveRecords();
    S.page = 'record';
    S.emoOpen = false;
    render();
    toast('已保存，接着写下一条');
  }else{
    S.page = 'feedback';
    render();
  }
  if(S.gh.token && S.gh.owner && S.gh.repo) W.ghPush(1);
}

/* --- 删除 / 清空 --- */
W.askDel = function(id){
  S.delId = id || null;
  var l = dayEntries(S.date).filter(function(e){ return hasContent(e); });
  S.modal = {
    title: l.length > 1 ? '确定要删掉这一条吗？' : '确定要删掉这一天的记录吗？',
    body:'删掉就找不回来了。',
    btns:[{ text:'再想想' }, { text:'确认删除', pri:true, act:'doDel' }]
  };
  renderModal();
};
W.askClear = function(){
  S.modal = {
    title:'确定要清空全部记录吗？',
    body:'全部 '+allEntries().length+' 条记录都会被删除，无法恢复。<br>建议先导出一份 JSON 备份。',
    btns:[{ text:'再想想' }, { text:'确认清空', pri:true, act:'doClear' }]
  };
  renderModal();
};
W.closeModal = function(e){ if(e.target.classList.contains('mask')){ S.modal=null; renderModal(); } };
W.modalAct = function(i){
  var b = S.modal.btns[i];
  var act = b.act;
  S.modal = null; renderModal();
  if(act==='forceSave') doSave(collectFromDOM());
  else if(act==='doDel'){
    var id = S.delId; S.delId = null;
    var l = dayEntries(S.date);
    var k = -1, j;
    for(j=0;j<l.length;j++) if(l[j].id === id) k = j;
    if(k >= 0) l.splice(k, 1);
    if(S.entryId === id) S.entryId = null;
    pruneEmpty(S.date);
    saveRecords();
    toast('已删除');
    if(dayEntries(S.date).filter(function(e){ return hasContent(e); }).length){ S.page='detail'; render(); }
    else W.go('calendar');
  }
  else if(act==='doClear'){ S.records = {}; S.entryId = null; saveRecords(); toast('已清空'); W.go('home'); }
};

/* --- 回看页 --- */
W.calView = function(v){ S.calView = v; render(); };
W.calMove = function(n){
  var y = +S.calYM.slice(0,4), m = +S.calYM.slice(5,7) - 1 + n;
  var d = new Date(y, m, 1);
  var nv = d.getFullYear()+'-'+((d.getMonth()+1)<10?'0':'')+(d.getMonth()+1);
  if(nv > today().slice(0,7)) return;
  S.calYM = nv; render();
};

/* --- 设置：GitHub --- */
/* 配置只允许可打印 ASCII：复制粘贴常带进全角字符/弯引号/中文，
   一旦进了 header，fetch 会在发请求前直接抛错（String contains non ISO-8859-1 code point） */
W.setGH = function(k, v){
  var raw = String(v == null ? '' : v);
  var clean = raw.replace(/[^\x20-\x7E]/g, '').trim();
  if(clean !== raw.trim()){
    setTimeout(function(){ toast('已自动清除「' + k + '」里的非法字符（多来自复制粘贴）'); }, 0);
  }
  S.gh[k] = clean; lsSet(K.gh, S.gh);
};
function ghURL(){
  var g = S.gh;
  return 'https://api.github.com/repos/'+encodeURIComponent(g.owner)+'/'+encodeURIComponent(g.repo)+
         '/contents/'+g.path.split('/').map(encodeURIComponent).join('/');
}
/* 公共仓库只读时可以不填 token：此时不发送 Authorization 头，避免空凭据被判为 401 */
function ghHeaders(){
  var h = { 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' };
  if(S.gh.token) h['Authorization'] = 'token '+S.gh.token;
  return h;
}
/* fetch 在 header 含非 ISO-8859-1 字符时会「同步抛错」而不是返回 rejected Promise，
   包一层，避免把调用方（含启动流程）整段打断 */
function ghFetch(url, opt){
  try{ return fetch(url, opt); }
  catch(e){ return Promise.reject(e); }
}
/* 云端条目数与 sha：用于推送前的「覆盖安全闸」 */
function ghCloudStat(){
  if(!ghReadyPull()) return Promise.resolve(null);
  return ghFetch(ghURL()+'?ref='+encodeURIComponent(S.gh.branch||'main'), { headers:ghHeaders() })
    .then(function(r){ if(r.status===404 || !r.ok) return null; return r.json(); })
    .then(function(j){
      if(!j || !j.content) return null;
      try{ var p = parsePayload(JSON.parse(unb64(j.content))); return { count:(p.list||[]).length, sha:j.sha }; }
      catch(e){ return null; }
    })
    .catch(function(){ return null; });
}
function b64(str){
  var b = new TextEncoder().encode(str), s = '';
  for(var i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function unb64(str){
  var s = atob(String(str).replace(/\s/g,'')), b = new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) b[i] = s.charCodeAt(i);
  return new TextDecoder().decode(b);
}
/* 推送（写）：三项必须齐全 */
function ghReady(){
  if(!S.gh.token || !S.gh.owner || !S.gh.repo){ toast('先把 token、用户名、仓库名填好'); return false; }
  return true;
}
/* 拉取（读）：公共仓库只需 owner + repo，不填 token 也能读 */
function ghReadyPull(){
  return !!(S.gh.owner && S.gh.repo);
}
W.ghTest = function(){
  if(!ghReady()) return;
  ghFetch(ghURL()+'?ref='+encodeURIComponent(S.gh.branch||'main'), { headers:ghHeaders() })
    .then(function(r){
      if(r.status===404) { toast('连接正常，云端还没有数据文件，保存一次就会创建'); return null; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(j){ if(j) toast('连接正常，云端已有数据'); })
    .catch(function(e){
      var m = /non ISO-8859-1/i.test(e.message || '')
        ? 'token 里有非法字符（全角/中文/弯引号），请重新粘贴一次'
        : (e.message || '未知错误');
      toast('连不上：' + m);
    });
};
W.ghPull = function(silent){
  if(!ghReadyPull()){
    if(!silent) toast('先填好「仓库 owner」和「仓库名」（公共仓库只读可不填 token）');
    return Promise.resolve();
  }
  var url = ghURL()+'?ref='+encodeURIComponent(S.gh.branch||'main');
  return ghFetch(url, { headers:ghHeaders() })
    .then(function(r){ if(r.status===404) return null; if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){
      if(!j || !j.content) return;
      var p = parsePayload(JSON.parse(unb64(j.content)));
      S.gh.sha = j.sha;
      S._pulling = true;                    /* 合并期间禁止回推，避免与云端来回打架 */
      var res, ws, ms, ml;
      try{
        res = mergeEntries(p.list);
        ws = p.weeks ? mergeWeeks(p.weeks) : { added:0, upd:0 };
        ms = p.months ? mergeMonths(p.months) : { added:0, upd:0 };
        ml = p.mlinks ? mergeMlinks(p.mlinks) : { added:0, upd:0 };
        saveRecords();
        if(ws.added || ws.upd) saveWk();
        if(ms.added || ms.upd) saveMo();
        if(ml.added || ml.upd) saveMlinks();
      } finally { S._pulling = false; }
      if(!silent){
        var msg = '已拉取：记录 新增 '+res.added+' 条、更新 '+res.upd+' 条';
        if(ws.added || ws.upd) msg += '｜周复盘 新增 '+ws.added+' 周、更新 '+ws.upd+' 周';
        if(ms.added || ms.upd) msg += '｜月复盘 新增 '+ms.added+' 月、更新 '+ms.upd+' 月';
        toast(msg); render();
      }
      /* 启动时的静默拉取：真的拉到了东西才提示一句，避免无声无息 */
      else if(res && (res.added || res.upd || ws.added || ws.upd || ms.added || ms.upd || ml.added || ml.upd)){
        toast('已从云端同步：记录 新增 ' + res.added + '、更新 ' + res.upd);
        render();
      }
    })
    .catch(function(e){ if(!silent) toast('拉取失败：'+e.message); });
};
W.ghPush = function(silent){
  if(!ghReady()) return Promise.resolve();
  /* 覆盖安全闸：本地条目数少于云端时，绝不把云端冲掉 —— 先拉再写 */
  return ghCloudStat().then(function(st){
    if(st){
      S.gh.sha = st.sha;
      var n = allEntries().length;
      if(st.count > n){
        toast('云端有 ' + st.count + ' 条、本地只有 ' + n + ' 条 —— 已阻止覆盖，请先点「从云端拉取」');
        if(!silent) render();
        return;
      }
    }
    var payload = { v:4, updatedAt:Date.now(), records:allEntries(), weeks:S.wk, months:S.mo, mlinks:S.mlinks };
    var body = { message:'review: '+today()+' 更新', content:b64(JSON.stringify(
        payload, null, 2)),
        branch:S.gh.branch||'main' };
    if(S.gh.sha) body.sha = S.gh.sha;
    return ghFetch(ghURL(), { method:'PUT', headers:ghHeaders(), body:JSON.stringify(body) })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){
        S.gh.sha = j.content && j.content.sha;
        if(!silent) toast('已推送到云端');
      })
      .catch(function(e){
        if(!silent) toast('推送失败：'+e.message);
        // 仅 sha 冲突（409）时先拉再推一次，其它错误不重试
        if(e.message === 'HTTP 409'){
          W.ghPull(1).then(function(){ W.ghPush(1); });
        }
      });
  });
};

/* --- 设置：导入导出备份 --- */
/* 下载数据为 json 文件：导出的是「全部历史记录」（不是某一天），
   文件名带当天日期仅用于区分备份版本。 */
function downloadJSON(silent){
  var data = allEntries();
  var payload = { v:4, exportedAt:Date.now(), records:data, weeks:S.wk, months:S.mo, mlinks:S.mlinks };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '观自在_全量备份_' + today().replace(/-/g,'') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  S.prefs.lastExport = Date.now();
  lsSet(K.prefs, S.prefs);
  if(!silent) toast('已导出全部 '+data.length+' 条记录、'+Object.keys(S.wk).length+' 周复盘、'+Object.keys(S.mo).length+' 月复盘');
  return true;
}
W.exportJSON = function(){ downloadJSON(false); };

/* 每周日自动备份：仅在周日打开页面时触发（指定备份日），
   若本周日还没备份过且有记录，自动下载一份「全部历史」的 json（双保险：本地留存 + GitHub 云）。
   低频、不催促——符合"不评判、不打扰"的产品原则。 */
W.maybeAutoBackup = function(){
  if(!S.prefs.autoBackup) return;
  if(new Date().getDay() !== 0) return;                  /* 只在周日备份（getDay: 0=周日） */
  var week = mondayOf(today());                          /* 本周周一的日期作为周标识 */
  if(S.prefs.lastAutoBackup === week) return;            /* 本周日已备份过 */
  if(allEntries().length === 0) return;                  /* 还没有任何记录，无需备份 */
  S.prefs.lastAutoBackup = week;
  lsSet(K.prefs, S.prefs);
  downloadJSON(true);
  toast('已自动备份全部历史记录（'+today()+'）到你的下载目录');
};

/* 自动备份开关 */
W.toggleAutoBackup = function(){
  S.prefs.autoBackup = !S.prefs.autoBackup;
  lsSet(K.prefs, S.prefs);
  if(S.prefs.autoBackup) W.maybeAutoBackup(); else toast('已暂停每周本地自动备份');
  render();
};
W.importJSON = function(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var p = parsePayload(JSON.parse(fr.result));
      var res = mergeEntries(p.list);
      var ws = p.weeks ? mergeWeeks(p.weeks) : { added:0, upd:0 };
      var ms = p.months ? mergeMonths(p.months) : { added:0, upd:0 };
      var ml = p.mlinks ? mergeMlinks(p.mlinks) : { added:0, upd:0 };
      saveRecords();
      if(ws.added || ws.upd) saveWk();
      if(ms.added || ms.upd) saveMo();
      if(ml.added || ml.upd) saveMlinks();
      toast('已导入记录 '+res.added+' 条、更新 '+res.upd+' 条'
        + ((ws.added||ws.upd) ? '；周复盘 新增 '+ws.added+' 周、更新 '+ws.upd+' 周' : '')
        + ((ms.added||ms.upd) ? '；月复盘 新增 '+ms.added+' 月、更新 '+ms.upd+' 月' : ''));
      render();
    }catch(e){ toast('这个文件读不出来，换一个备份文件试试'); }
    input.value = '';
  };
  fr.readAsText(file, 'utf-8');
};
W.restoreBackup = function(){
  var bak = lsGet(K.bak, null);
  if(!bak || !bak.records){ toast('没有可用的备份'); return; }
  S.records = normalizeAll(bak.records);
  if(bak.weeks && typeof bak.weeks === 'object') S.wk = bak.weeks;
  if(bak.months && typeof bak.months === 'object') S.mo = bak.months;
  S.entryId = null;
  saveRecords();
  saveWk();
  saveMo();
  toast('已恢复到 '+new Date(bak.at).toLocaleString('zh-CN')+' 的状态');
  render();
};

/* --- 快捷键 --- */
document.addEventListener('keydown', function(e){
  var el = e.target || {};
  var tag = (el.tagName||'').toLowerCase();
  if(tag==='textarea' || tag==='input' || tag==='select') return;
  if(el.isContentEditable) return;
  if(el.closest && el.closest('[contenteditable="true"]')) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key==='Escape' && S.modal){ S.modal = null; renderModal(); return; }
  if(e.key==='Escape' && S.emoModal){ W.closeEmo(0); return; }
  if(S.modal || S.emoModal) return;
  if(e.key==='1') W.go('home');
  if(e.key==='2') W.go('record', today());
  if(e.key==='3') W.go('calendar');
});

/* ---------- 启动 ---------- */
(function init(){
  S.date = today();
  S.calYM = today().slice(0,7);
  if(!storageOK()){
    setTimeout(function(){ toast('当前浏览器无法保存记录，换普通模式即可保存'); }, 600);
  }
  loadAll();
  render();
  // 每周日自动本地备份：仅周日首次进入时下载一次，避免重复打扰
  setTimeout(function(){ W.maybeAutoBackup(); }, 600);
  // GitHub 云：启动拉取一次合并（公共仓库只读只需 owner+repo）；有新改动时由保存自动回推
  // 无论拉取如何失败都不能打断启动流程
  try{
    if(ghReadyPull()) W.ghPull(1).catch(function(){});
  }catch(e){}
})();
</script>
