<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>观自在 · 每日记录</title>
<style>
/* ============ 设计令牌 · 山谷苔原 · 沉静的绿 ============
   基调：雾感灰白纸底 + 沉静墨绿主色 + 苔原枯草金点缀
   像山谷里的苔原——苍茫、沉静、有深度，不鲜亮不跳跃。
   中性色带一层冷灰绿，主色偏深墨绿，保证长时间阅读舒适。
   ==================================== */
:root{
  /* 中性（带冷灰绿的苔原灰阶） */
  --ink-900:#1B201D; --ink-800:#262C28; --ink-700:#343C36; --ink-600:#424A43;
  --ink-500:#555E56; --ink-400:#6E786E; --ink-300:#8D968C; --ink-200:#B2BAB0;
  /* 纸面（苔原雾感，带一层很轻的冷绿） */
  --paper:#F3F2ED; --paper-2:#EAEAE3; --paper-3:#DEDED5; --surface:#FBFAF6;
  --line:#D7D9CE; --line-soft:#EAE9E1;
  /* 主色（沉静墨绿，偏深、带灰调） */
  --pri:#45594B; --pri-600:#37493E; --pri-400:#7E9A88; --pri-050:#E4EBE1;
  /* 点缀（苔原枯草金，沉静的低饱和暖色） */
  --acc:#A08D4E; --acc-050:#F3EEDC;
  /* 圆角 / 缓动 / 间距 / 字号 / 阴影 */
  --r-xs:8px; --r-sm:10px; --r:14px; --r-md:18px; --r-lg:24px;
  --ease:cubic-bezier(.22,.9,.3,1);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-md:16px; --fs-lg:18px;
  --fs-xl:clamp(20px,2.4vw,23px); --fs-2xl:clamp(26px,3.6vw,34px);
  --shadow-xs:0 1px 2px rgba(27,32,29,.05);
  --shadow-sm:0 1px 3px rgba(27,32,29,.05), 0 4px 12px rgba(27,32,29,.04);
  --shadow-md:0 2px 6px rgba(27,32,29,.05), 0 12px 28px rgba(27,32,29,.06);
  --shadow-lg:0 8px 20px rgba(27,32,29,.08), 0 24px 56px rgba(27,32,29,.10);
  /* 旧名兼容（历史类名继续可用） */
  --bg:var(--paper); --card:var(--surface); --sub:var(--paper-2); --sub2:var(--ink-500);
  --text:var(--ink-800); --muted:var(--ink-400); --pri2:var(--pri-400); --line2:var(--line-soft);
  --shadow:var(--shadow-sm);
}
[data-theme="dark"]{
  --ink-900:#F2F3EE; --ink-800:#E2E5DF; --ink-700:#C3C9C0; --ink-600:#A5ADA2;
  --ink-500:#8A9488; --ink-400:#707A6F; --ink-300:#576057; --ink-200:#40483F;
  --paper:#191C19; --paper-2:#20241F; --paper-3:#2A2F29; --surface:#20241F;
  --line:#343A33; --line-soft:#2A2F29;
  --pri:#8FAB98; --pri-600:#718B7B; --pri-400:#AAC4B1; --pri-050:#232E27;
  --acc:#C0AD66; --acc-050:#2E2C20;
  --shadow-xs:0 1px 2px rgba(0,0,0,.32);
  --shadow-sm:0 1px 3px rgba(0,0,0,.30), 0 4px 12px rgba(0,0,0,.22);
  --shadow-md:0 2px 6px rgba(0,0,0,.32), 0 12px 28px rgba(0,0,0,.28);
  --shadow-lg:0 8px 20px rgba(0,0,0,.42), 0 24px 56px rgba(0,0,0,.34);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink-800);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  font-size:var(--fs-base); line-height:1.72; -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"kern" 1;
  transition:background .4s var(--ease),color .4s var(--ease);
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--pri);text-decoration:none}
::selection{background:rgba(160,141,78,.24)}
:focus-visible{outline:2px solid var(--pri-400);outline-offset:2px;border-radius:var(--r-xs)}

/* ============ 布局 ============ */
.app{max-width:1120px;margin:0 auto;padding:0 24px 132px}
/* 阅读型页面收窄到 760px，长文本更易读；记录页两栏仍用满宽 */
.app.narrow{max-width:760px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  padding:26px 0 10px}
.brand{display:flex;align-items:center;gap:11px;font-size:var(--fs-md);font-weight:600;
  letter-spacing:.02em;color:var(--ink-800)}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 3.5px rgba(160,141,78,.18)}
.hd-act{display:flex;align-items:center;gap:2px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-500);transition:background .22s var(--ease),color .22s var(--ease)}
.iconbtn:hover{background:var(--paper-2);color:var(--ink-800)}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;
  display:flex;gap:2px;padding:5px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.nav button{display:flex;align-items:center;gap:7px;
  padding:9px 20px;border-radius:999px;font-size:var(--fs-sm);font-weight:500;
  color:var(--ink-500);transition:.24s var(--ease);white-space:nowrap}
.nav button:hover{color:var(--ink-800);background:var(--paper-2)}
.nav button.on{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(69,89,75,.30)}
.nav button svg{opacity:.85}

/* ============ 通用组件 ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);padding:var(--sp-5);
  transition:box-shadow .3s var(--ease),border-color .3s var(--ease)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 22px;border-radius:999px;font-size:var(--fs-base);font-weight:500;
  letter-spacing:.01em;transition:.24s var(--ease);border:1px solid transparent}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 3px 12px rgba(69,89,75,.28)}
.btn-pri:hover{background:var(--pri-600);transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(69,89,75,.32)}
.btn-pri:active{transform:translateY(0)}
.btn-ghost{border-color:var(--line);color:var(--ink-600);background:var(--surface)}
.btn-ghost:hover{color:var(--ink-800);border-color:var(--ink-300);background:var(--paper-2)}
.btn-lg{padding:14px 34px;font-size:var(--fs-md)}
.btn-txt{color:var(--ink-500);padding:8px 12px;border-radius:var(--r-sm);font-size:var(--fs-sm)}
.btn-txt:hover{color:var(--pri)}
.hint{font-size:var(--fs-sm);color:var(--ink-400);line-height:1.72}

/* 分段控件（月历 / 清单） */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;
  background:var(--paper-2);border:1px solid var(--line-soft)}
.seg button{padding:7px 18px;border-radius:999px;font-size:var(--fs-sm);font-weight:500;
  color:var(--ink-500);transition:.24s var(--ease)}
.seg button:hover{color:var(--ink-800)}
.seg button.on{background:var(--surface);color:var(--ink-800);box-shadow:var(--shadow-xs)}

.fade{animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 首页 */
.hero{text-align:center;padding:var(--sp-5) 0 var(--sp-6)}
.hero .d{font-size:var(--fs-xs);letter-spacing:.26em;color:var(--ink-400);
  text-transform:uppercase;font-weight:500}
.hero .g{font-size:var(--fs-2xl);font-weight:600;margin-top:var(--sp-3);
  letter-spacing:.01em;line-height:1.35;color:var(--ink-900)}
.stat{text-align:center;padding:var(--sp-6) var(--sp-5)}
.stat .t{font-size:var(--fs-xl);font-weight:600;letter-spacing:.01em;color:var(--ink-900)}
.stat .s{font-size:var(--fs-sm);color:var(--ink-400);margin-top:var(--sp-2);line-height:1.7}
.bar{height:5px;border-radius:99px;background:var(--paper-3);overflow:hidden;margin-top:var(--sp-5)}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--pri-400),var(--pri));transition:width .9s var(--ease)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-3)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-4) var(--sp-4);text-align:left;transition:.28s var(--ease);box-shadow:var(--shadow-xs)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--pri-400)}
.tile .tt{font-size:var(--fs-base);font-weight:500;color:var(--ink-800)}
.tile .ts{font-size:var(--fs-xs);color:var(--ink-400);margin-top:var(--sp-1)}

/* 记录页 */
.pghd{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0 var(--sp-4)}
.pghd .ti{font-size:var(--fs-lg);font-weight:600;flex:1;letter-spacing:.01em;color:var(--ink-900)}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-200);transition:.35s var(--ease)}
.dots i.on{background:var(--pri);transform:scale(1.25)}

.steps{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5);align-items:start}
@media (max-width:900px){.steps{grid-template-columns:1fr;gap:var(--sp-4)}}
.entbar{display:flex;align-items:center;justify-content:center;gap:var(--sp-1);
  padding:0 0 var(--sp-4)}
.entbar .lbl{font-size:var(--fs-sm);color:var(--ink-500);min-width:150px;text-align:center}
.entbar .lbl b{color:var(--pri);font-weight:600}
.stepcol{display:flex;flex-direction:column;gap:var(--sp-3)}
.stephead{display:flex;align-items:baseline;gap:var(--sp-2);padding:2px 2px var(--sp-1)}
.stephead .n{font-size:var(--fs-base);font-weight:600;color:var(--pri);letter-spacing:.02em}
.stephead .s{font-size:var(--fs-xs);color:var(--ink-400);letter-spacing:.14em;font-weight:500}
.stephead::after{content:"";flex:1;height:1px;background:var(--line);margin-bottom:4px}

.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-4) var(--sp-4) var(--sp-4);box-shadow:var(--shadow-xs);
  transition:opacity .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
.fcard.dim{opacity:.38}
.fcard.focus{border-color:var(--pri-400);box-shadow:var(--shadow-md)}
.fchead{display:flex;align-items:center;gap:var(--sp-2)}
.fcno{font-size:var(--fs-sm);color:var(--acc);font-weight:600;min-width:26px;letter-spacing:.02em}
.fclabel{font-size:var(--fs-base);font-weight:600;letter-spacing:.01em;color:var(--ink-800)}
.req{font-size:10.5px;font-style:normal;color:var(--ink-400);border:1px solid var(--line);
  border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:1px;letter-spacing:.02em}
.fcguide{font-size:var(--fs-sm);color:var(--ink-500);margin-top:5px;line-height:1.7}
.fcprompts{margin:var(--sp-2) 0 0;padding-left:18px;color:var(--ink-400);
  font-size:var(--fs-xs);line-height:1.9}
.fctip{margin-top:var(--sp-2);font-size:var(--fs-xs);color:var(--ink-400);line-height:1.75;
  padding-left:var(--sp-3);border-left:2px solid var(--line)}
.fcta{width:100%;margin-top:var(--sp-3);border:none;background:var(--paper-2);
  border-radius:var(--r-sm);padding:var(--sp-3) var(--sp-3);line-height:1.78;resize:none;
  outline:none;overflow:hidden;border:1px solid transparent;
  transition:background .24s var(--ease),border-color .24s var(--ease);font-size:14.5px}
.fcta:focus{background:var(--surface);border-color:var(--pri-400)}
.fcta::placeholder{color:var(--ink-300);line-height:1.7}
.fcsplit{margin-top:var(--sp-2);font-size:var(--fs-xs);line-height:1.75;color:#9A7124;
  background:var(--acc-050);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-3);
  display:none;border-left:2px solid var(--acc)}
.fcsplit.show{display:block;animation:fadeUp .32s var(--ease) both}
[data-theme="dark"] .fcsplit{color:#E0B463}

/* 情绪轮盘 */
.emotoggle{margin-top:var(--sp-2);font-size:var(--fs-xs);color:var(--ink-500);
  padding:6px 0;display:inline-flex;align-items:center;gap:5px;transition:color .22s var(--ease)}
.emotoggle:hover{color:var(--pri)}
.emopanel{margin-top:var(--sp-2);padding:var(--sp-3) 0;text-align:center;
  animation:fadeUp .36s var(--ease) both}
.wheel{width:100%;max-width:296px;height:auto}
.wsect{cursor:pointer;transition:.22s var(--ease);stroke:var(--surface);stroke-width:1.5}
.wsect:hover{stroke:var(--acc);stroke-width:2.5}
.wsect.sel{stroke:var(--acc);stroke-width:2.5}
.wtxt{cursor:pointer;font-size:11.5px;letter-spacing:.02em;text-anchor:middle;
  dominant-baseline:middle;pointer-events:auto}
.wname{font-size:10.5px;text-anchor:middle;dominant-baseline:middle;opacity:.85}
.wmid{font-size:10px;fill:var(--ink-400);text-anchor:middle;dominant-baseline:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp-3);justify-content:center}
.chip{font-size:var(--fs-xs);padding:4px 11px;border-radius:999px;
  background:var(--acc-050);color:var(--acc);display:inline-flex;align-items:center;gap:5px;
  font-weight:500}
.chip b{font-weight:400;cursor:pointer;opacity:.55;transition:opacity .2s var(--ease)}
.chip b:hover{opacity:1}

/* 底部操作条 */
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:var(--sp-3) 20px 20px;
  background:linear-gradient(to top,var(--paper) 58%,rgba(251,249,245,0));
  display:flex;flex-direction:column;align-items:center;gap:6px}
[data-theme="dark"] .footbar{background:linear-gradient(to top,var(--paper) 58%,rgba(25,24,23,0))}
.footbar .row{display:flex;gap:var(--sp-2);align-items:center}

/* 日历 */
.calwrap{max-width:420px;margin:0 auto}
.calhead{display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-2) 0 var(--sp-3)}
.calhead .m{font-size:var(--fs-lg);font-weight:600;letter-spacing:.01em;color:var(--ink-900)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{text-align:center;font-size:var(--fs-xs);color:var(--ink-400);
  padding-bottom:var(--sp-1);font-weight:500;letter-spacing:.04em}
.cel{position:relative;aspect-ratio:1/1;max-height:52px;border-radius:var(--r-sm);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;
  color:var(--ink-600);transition:.22s var(--ease);border:1px solid transparent}
.cel:hover:not(.dis){background:var(--paper-2);color:var(--ink-900)}
.cel.dis{cursor:not-allowed;opacity:.26}
.cel.today{border-color:var(--pri-400);color:var(--pri);font-weight:600}
.cel .mk{width:7px;height:7px;border-radius:50%}
.cel .cnum{font-size:9.5px;line-height:1;color:var(--pri);font-weight:600;opacity:.85}
.cel .mk.l1{background:var(--pri);opacity:.32}
.cel .mk.l2{background:var(--pri);opacity:.58}
.cel .mk.l3{background:var(--pri);opacity:.82}
.cel .mk.l4{background:var(--pri)}
.cel .dd{line-height:1}
/* 周复盘金色小点：实心=已归档，空心=有内容未归档 */
.cel .wmk{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.cel .wmk.draft{background:transparent;border:1.5px solid var(--acc);opacity:.7}
.cel.dis .wmk{opacity:.35}
.overview{margin-top:var(--sp-5);padding:var(--sp-4) var(--sp-4);border-radius:var(--r-md);
  background:var(--paper-2);font-size:var(--fs-sm);color:var(--ink-600);line-height:1.75;
  border:1px solid var(--line-soft)}
.overview .kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp-2)}

/* ============ 清单视图 ============ */
.list{display:flex;flex-direction:column;gap:var(--sp-5)}
.lgroup{display:flex;flex-direction:column}
.lhead{display:flex;align-items:baseline;gap:var(--sp-2);padding:0 2px var(--sp-2);
  border-bottom:1px solid var(--line);margin-bottom:var(--sp-2)}
.lhead .ld{font-size:var(--fs-base);font-weight:600;color:var(--ink-800);letter-spacing:.01em}
.lhead .lw{font-size:var(--fs-xs);color:var(--ink-400)}
.lhead .ln{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-400);
  background:var(--paper-2);border-radius:999px;padding:2px 9px;font-weight:500}
.litem{display:flex;align-items:flex-start;gap:var(--sp-3);width:100%;text-align:left;
  padding:var(--sp-3) var(--sp-3);border-radius:var(--r);
  transition:background .22s var(--ease),transform .22s var(--ease);border:1px solid transparent}
.litem:hover{background:var(--surface);border-color:var(--line);transform:translateX(2px)}
.li-no{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pri-050);
  color:var(--pri);font-size:var(--fs-xs);font-weight:600;display:grid;place-items:center;margin-top:2px}
[data-theme="dark"] .li-no{background:var(--pri-050)}
.li-main{flex:1;min-width:0}
.li-title{font-size:var(--fs-base);color:var(--ink-800);line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;word-break:break-word}
.li-title.draft{color:var(--ink-400)}
.li-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.li-meta .mt{font-size:var(--fs-xs);color:var(--ink-400)}
.li-meta .chip{margin-top:0;padding:2px 9px;font-size:11px}
.li-dot{width:3px;height:3px;border-radius:50%;background:var(--ink-300);flex:none}
.li-tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--paper-3);
  color:var(--ink-500);font-weight:500}
.li-tag.draft{background:var(--acc-050);color:var(--acc)}
.li-arrow{flex:none;color:var(--ink-300);transition:.22s var(--ease);margin-top:4px}
.litem:hover .li-arrow{color:var(--pri);transform:translateX(2px)}

/* 详情 */
.entsep{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-6) 0 var(--sp-4);
  color:var(--ink-400);font-size:var(--fs-xs);letter-spacing:.06em;font-weight:500}
.entsep::before,.entsep::after{content:'';flex:1;height:1px;background:var(--line)}
.dt-hd{display:flex;align-items:baseline;gap:var(--sp-3);padding:var(--sp-2) 0 var(--sp-5)}
.dt-hd .d{font-size:var(--fs-xl);font-weight:600;letter-spacing:.01em;color:var(--ink-900)}
.dt-hd .w{font-size:var(--fs-sm);color:var(--ink-400)}
.fnd{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r);background:var(--acc-050);border-left:2px solid var(--acc);
  margin-bottom:var(--sp-4);font-size:var(--fs-base);line-height:1.75;color:var(--ink-700)}
.fnd .l{color:var(--acc);font-size:var(--fs-xs);flex:none;letter-spacing:.08em;font-weight:600;
  padding-top:3px}
.rocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-4);margin-bottom:var(--sp-2);box-shadow:var(--shadow-xs)}
.rocard .h{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-1)}
.rocard .no{font-size:var(--fs-sm);color:var(--acc);font-weight:600;min-width:26px}
.rocard .lb{font-size:var(--fs-sm);font-weight:600;color:var(--ink-700)}
.rocard .v{font-size:14.5px;color:var(--ink-600);line-height:1.85;
  white-space:pre-wrap;word-break:break-word}

/* 设置 */
.set-sec{margin-bottom:var(--sp-4)}
.set-sec h3{font-size:var(--fs-xs);font-weight:600;margin:0 0 var(--sp-3);
  color:var(--ink-400);letter-spacing:.14em;text-transform:uppercase}
.fld{margin-bottom:var(--sp-3)}
.fld label{display:block;font-size:var(--fs-xs);color:var(--ink-500);margin-bottom:5px}
.fld input{width:100%;padding:10px var(--sp-3);border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--paper-2);outline:none;
  transition:.22s var(--ease);font-size:var(--fs-sm)}
.fld input:focus{border-color:var(--pri-400);background:var(--surface)}
.row-btns{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}

/* 正反馈页 */
.fbwrap{min-height:62vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:var(--sp-5) 0}
.fbcard{max-width:560px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--sp-7) var(--sp-6);box-shadow:var(--shadow-md);
  animation:fadeUp .6s var(--ease) both}
.fbcard .lbl{font-size:var(--fs-xs);letter-spacing:.24em;color:var(--acc);font-weight:600}
.fbcard .txt{font-size:var(--fs-xl);font-weight:500;line-height:1.8;margin-top:var(--sp-4);
  color:var(--ink-900);word-break:break-word;white-space:pre-wrap;letter-spacing:.01em}
.gold{height:2px;border-radius:99px;margin:var(--sp-5) 0;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.7}
.enco{font-size:var(--fs-base);color:var(--ink-500);
  animation:fadeUp .6s .18s var(--ease) both}

/* 弹层 */
.mask{position:fixed;inset:0;z-index:90;background:rgba(28,26,24,.40);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fadeIn .24s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-md);padding:var(--sp-5);
  max-width:400px;width:100%;box-shadow:var(--shadow-lg);
  animation:fadeUp .32s var(--ease) both}
.modal .mt{font-size:var(--fs-md);font-weight:600;color:var(--ink-900);letter-spacing:.01em}
.modal .mb{font-size:var(--fs-sm);color:var(--ink-500);line-height:1.8;margin-top:var(--sp-2)}
.modal .mf{display:flex;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-5)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:100;
  background:var(--ink-800);color:var(--paper);padding:11px 22px;border-radius:999px;
  font-size:var(--fs-sm);box-shadow:var(--shadow-lg);
  animation:toastIn .32s var(--ease) both;max-width:88vw;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.out{animation:toastOut .28s ease both}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px)}}

.empty{text-align:center;padding:var(--sp-7) 20px;color:var(--ink-400);
  font-size:var(--fs-sm);line-height:2}
.empty .e{font-size:28px;opacity:.42;display:block;margin-bottom:var(--sp-2)}

/* 滚动条（桌面端细节） */
@media (hover:hover){
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:99px;
    border:3px solid var(--paper)}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-300)}
  ::-webkit-scrollbar-track{background:transparent}
}
@media (max-width:640px){
  .app{padding:0 18px 128px}
  .nav button{padding:9px 16px}
  .fbcard{padding:var(--sp-6) var(--sp-4)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ============ 周度复盘 ============ */
.wkbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:0 0 var(--sp-4)}
.wkbar .m{font-size:var(--fs-sm);color:var(--ink-600);letter-spacing:.02em}
.wkstep{margin:var(--sp-6) 0 var(--sp-2);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--line-soft);padding-top:var(--sp-5)}
.wkstep .n{font-size:var(--fs-xs);letter-spacing:.16em;color:var(--pri);font-weight:600}
.wkstep .t{font-size:var(--fs-lg);font-weight:600;color:var(--ink-900)}
.wkstep .s2{font-size:var(--fs-sm);color:var(--ink-400)}
.wkcount{font-size:var(--fs-xs);color:var(--ink-400);margin:10px 0 12px}
.wkevts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-2)}
.wkevt{text-align:left;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:10px 12px;font-size:var(--fs-sm);color:var(--ink-700);transition:.22s var(--ease);
  position:relative;display:flex;flex-direction:column;gap:3px}
.wkevt:hover{border-color:var(--pri-400);transform:translateY(-1px);box-shadow:var(--shadow-xs)}
.wkevt.on{border-color:var(--pri);background:var(--pri-050)}
.wkevt .d{font-size:var(--fs-xs);color:var(--ink-300)}
.wkevt .ck{position:absolute;right:9px;top:8px;color:var(--pri);font-weight:700}
.wklink{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--acc-050);
  border:1px solid var(--acc-200);border-radius:var(--r-sm);padding:8px 12px;font-size:var(--fs-sm);
  color:var(--ink-700);margin-bottom:6px}
.wklink .ar{color:var(--acc);font-weight:600}
.wklink .tp{font-size:var(--fs-xs);color:#8A7639;border:1px solid var(--acc-200);border-radius:999px;padding:1px 8px}
.wkadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.wkadd select{padding:9px 10px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);font-size:var(--fs-sm);color:var(--ink-700);max-width:230px;font-family:inherit}
.rm{color:var(--ink-400);font-size:17px;line-height:1;padding:2px 7px;border-radius:999px;transition:.2s var(--ease)}
.rm:hover{color:var(--ink-800);background:var(--paper-2)}
.wklink .rm{margin-left:auto}
.wkfield{margin-bottom:var(--sp-3)}
.wkfield .lb{font-size:var(--fs-sm);font-weight:500;color:var(--ink-700);display:flex;gap:8px;align-items:baseline}
.wkfield .lb .no{color:var(--pri);font-weight:600;font-size:var(--fs-xs)}
.wkfield .gd{font-size:var(--fs-xs);color:var(--ink-400);margin:3px 0 6px}
.wkfield textarea{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--paper-2);outline:none;font-family:inherit;font-size:var(--fs-sm);line-height:1.7;
  resize:vertical;transition:.22s var(--ease)}
.wkfield textarea:focus{border-color:var(--pri-400);background:var(--surface)}
.wkact{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);
  padding:var(--sp-4);margin-bottom:var(--sp-3);box-shadow:var(--shadow-xs)}
.wkact .hd2{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wkact .hd2 .n{font-size:var(--fs-xs);color:var(--ink-400);letter-spacing:.08em}
.wkact .what{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--paper-2);outline:none;font-size:var(--fs-sm);font-family:inherit;margin-bottom:8px;
  line-height:1.7;resize:vertical;min-height:84px;transition:.2s var(--ease)}
.wkact .what:focus{border-color:var(--pri-400);background:var(--surface)}
.wkact .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.wkact .cols .f label{display:block;font-size:var(--fs-xs);color:var(--ink-400);margin-bottom:3px}
.wkact .cols .f input{width:100%;padding:8px 10px;border-radius:var(--r-xs);border:1px solid var(--line);
  background:var(--paper-2);outline:none;font-size:var(--fs-sm);font-family:inherit;transition:.2s var(--ease)}
.wkact .cols .f input:focus{border-color:var(--pri-400);background:var(--surface)}
.wksave{display:flex;flex-direction:column;align-items:center;gap:8px;margin:var(--sp-6) 0 var(--sp-5)}
.wkentry{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wkentry .txt{font-size:var(--fs-sm);line-height:1.7}
[data-theme="dark"] .wklink .tp{color:#C0AD66}
/* ============ 周度复盘 · 跨页版式（右页素材 / 左页书写） ============ */
/* 窄屏 Tab：素材 / 复盘 */
.wktabs{display:none;margin:var(--sp-4) 0 0;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;width:240px}
.wktabs button{flex:1;padding:8px 0;font-size:var(--fs-sm);color:var(--ink-400);
  background:var(--surface);border:none;font-family:inherit;cursor:pointer;transition:.2s var(--ease)}
.wktabs button.on{background:var(--pri-050);color:var(--pri);font-weight:600}
/* 对开容器 */
.wkspread{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0;margin-top:var(--sp-4);
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.wkcol{padding:var(--sp-4) var(--sp-4) 0;min-width:0}
/* 素材列（DOM 在前）落在左侧且更宽 —— 先看素材，右侧书写列小一些 */
.wkcol-l{border-left:1px dashed var(--line)}
.wkcol-r{background:var(--paper-2);padding-left:0;padding-right:0;
  border-top-left-radius:var(--r-md);border-bottom-left-radius:var(--r-md)}
/* 右页顶部操作区：吸顶但绝不锁内容 —— 素材平铺，随页面滚动 */
.wktop{position:sticky;top:0;z-index:6;background:var(--paper-2);
  padding:0 var(--sp-4) 8px;border-bottom:1px solid var(--line-soft)}
.wktop .wkct{padding:0;margin-bottom:8px}
.wkstatus{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--fs-xs);
  color:var(--ink-500);margin:0 0 6px}
.wkstatus b{color:var(--ink-800)}
/* 问号悬浮说明：独立小圆标，悬停才出现，不与模式切换混在一起 */
.wkhelp{position:relative;flex:none;width:19px;height:19px;border:1px solid var(--line);
  border-radius:50%;color:var(--ink-400);font-size:var(--fs-xs);display:inline-grid;place-items:center;
  cursor:help;background:var(--surface);line-height:1;margin-left:6px;vertical-align:1px}
.wkhelp:hover{color:var(--pri);border-color:var(--pri)}
.wkhelp:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:-6px;
  background:var(--ink-900);color:#fff;font-size:var(--fs-xs);line-height:1.8;padding:9px 11px;
  border-radius:var(--r-sm);width:260px;z-index:30;white-space:pre-line;box-shadow:var(--shadow-lg)}
.wkct{font-size:var(--fs-sm);font-weight:600;color:var(--ink-800);margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wkct em{font-style:normal;font-weight:400;font-size:var(--fs-xs);color:var(--ink-400)}
/* 模式切换：① 聚焦 / ② 联结 */
/* 模式切换：每个步骤独立成一颗药丸，各自带一个问号说明 */
.wkmodes{display:flex;gap:6px;margin:0 0 6px}
.wkmode{flex:1;min-width:0;display:flex;align-items:center;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);transition:.2s var(--ease)}
.wkmode.on{border-color:var(--pri);background:var(--pri-050)}
.wkmode button{flex:1;min-width:0;padding:7px 4px 7px 12px;font-size:var(--fs-sm);color:var(--ink-500);
  background:transparent;border:none;font-family:inherit;cursor:pointer;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkmode.on button{color:var(--pri);font-weight:600}
.wkmode .wkhelp{margin:0 7px 0 0;border-color:transparent}
.wkmode.on .wkhelp{border-color:var(--pri-400)}
/* 筛选 */
.wkfilters{display:flex;gap:6px;padding:0 0 2px;flex-wrap:wrap}
.wkfilters button{font-size:var(--fs-xs);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;color:var(--ink-400);background:var(--surface);font-family:inherit;cursor:pointer}
.wkfilters button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-050)}
/* 素材区：平铺，随页面滚动，不再锁在小框里 */
.wkmat{position:relative;padding:0 var(--sp-4) var(--sp-3)}
.wkday{font-size:var(--fs-xs);color:var(--ink-400);letter-spacing:.04em;padding:12px 0 5px;
  border-bottom:1px solid var(--line-soft);margin-bottom:7px}
.wkcard{position:relative;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-sm);margin:0 38px 6px 0;transition:.2s var(--ease)}
.wkcard.on{border-color:var(--pri);background:var(--pri-050)}
.wkcard.anchor{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-050)}
.wkcrow{display:flex;align-items:center;gap:6px;padding:10px 42px 10px 8px;min-height:46px;cursor:pointer}
.wkcard.dis .wkcrow{cursor:default}
.wkchev{flex:none;width:22px;height:22px;border-radius:var(--r-xs);color:var(--ink-300);
  display:grid;place-items:center;font-size:11px;transition:.2s var(--ease)}
.wkchev:hover{color:var(--pri);background:var(--paper-2)}
.wkt{flex:1;font-size:var(--fs-sm);color:var(--ink-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkring{flex:none;position:absolute;right:9px;top:50%;transform:translateY(-50%);width:22px;height:22px;
  border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:13px;
  color:var(--ink-300);transition:.2s var(--ease)}
.wkring.on{border-style:solid;border-color:var(--pri);background:var(--pri);color:#fff;font-size:12px}
/* 聚焦满 3 件后，未选中的圈不再显示，避免视觉噪音 */
.wkmat.full .wkring:not(.on){display:none}
.wkcbody{padding:9px 12px 11px;font-size:var(--fs-xs);color:var(--ink-600);line-height:1.75;
  border-top:1px dashed var(--line-soft)}
.wkcbody .k{display:block;color:var(--ink-400);margin-top:5px}
.wkcbody .k:first-child{margin-top:0}
.wkcbody .gen{margin-top:10px}
/* 箭头层 */
.wkarrows{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:2}
.wkarrows .wkdot{pointer-events:auto;cursor:pointer}
/* 联结类型 / 状态行里的操作片 */
.wktype{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:var(--fs-xs);
  color:var(--ink-600);background:var(--surface);font-family:inherit;cursor:pointer;transition:.2s var(--ease)}
.wktype:hover{border-color:var(--acc);color:var(--acc)}
.wktype.on{border-color:var(--acc);background:var(--acc-050);color:var(--acc);font-weight:600}
/* 联结清单：类型徽章 + A → B 一行，原因另起一行，层级清楚 */
.wklinks{margin:0 var(--sp-4) var(--sp-3)}
.wklinks .lt{font-size:var(--fs-xs);color:var(--ink-400);letter-spacing:.04em;margin-bottom:6px}
.wklinkrow{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:10px 12px;margin-bottom:6px}
.wklinkrow .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wklinkrow .tp{flex:none;font-size:var(--fs-xs);color:#8A7639;border:1px solid var(--acc-200);
  border-radius:999px;padding:1px 8px;background:var(--acc-050)}
.wklinkrow .pair{flex:1;min-width:0;font-size:var(--fs-sm);color:var(--ink-800);line-height:1.65}
.wklinkrow .pair .ar{color:var(--acc);font-weight:600;padding:0 2px}
.wklinkrow .ops{flex:none;display:flex;gap:2px}
.wklinkrow .cs{margin-top:5px;font-size:var(--fs-xs);color:var(--ink-500);line-height:1.7}
.wklinkrow .cs.none{color:var(--ink-300)}
/* 联结原因弹窗 */
.wkovl{position:fixed;inset:0;z-index:200;background:rgba(20,22,20,.42);display:flex;
  align-items:center;justify-content:center;padding:20px}
.wkmodal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:var(--sp-5);position:relative;
  max-height:88vh;overflow-y:auto}
.wkmodal .wkmt{font-size:var(--fs-md);font-weight:600;color:var(--ink-900);padding-right:28px;line-height:1.6}
.wkmodal .wkmclose{position:absolute;right:13px;top:11px;color:var(--ink-300);font-size:20px;line-height:1;
  cursor:pointer;padding:2px 7px;border-radius:999px}
.wkmodal .wkmclose:hover{color:var(--ink-700);background:var(--paper-2)}
.wkmodal .wktypes{display:flex;gap:6px;margin:11px 0 2px;flex-wrap:wrap}
.wkmodal textarea{width:100%;margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--paper-2);outline:none;font-family:inherit;font-size:var(--fs-sm);line-height:1.7;
  resize:vertical;min-height:66px;transition:.2s var(--ease)}
.wkmodal textarea:focus{border-color:var(--pri-400);background:var(--surface)}
.wkweak{font-size:var(--fs-xs);color:var(--ink-300);margin-top:6px;line-height:1.7}
.wkmrow{display:flex;gap:8px;align-items:center;margin-top:11px}
.wkmrow label{flex:none;font-size:var(--fs-xs);color:var(--ink-400)}
.wkmrow input{flex:1;padding:8px 10px;border-radius:var(--r-xs);border:1px solid var(--line);
  background:var(--paper-2);outline:none;font-size:var(--fs-sm);font-family:inherit;transition:.2s var(--ease)}
.wkmrow input:focus{border-color:var(--pri-400);background:var(--surface)}
.wkmact{display:flex;justify-content:flex-end;gap:8px;margin-top:var(--sp-4)}
/* 行动来源 */
.wksrc{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-soft);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink-400)}
.wksrc select{flex:1;min-width:150px;padding:7px 9px;border-radius:var(--r-xs);border:1px solid var(--line);
  background:var(--paper-2);font-size:var(--fs-xs);font-family:inherit;color:var(--ink-600);outline:none}
/* 窄屏：改为 Tab 切换单列 */
@media(max-width:1000px){
  .wktabs{display:flex}
  .wkspread{grid-template-columns:1fr}
  .wkspread[data-tab="mat"] .wkcol-l{display:none}
  .wkspread[data-tab="write"] .wkcol-r{display:none}
  .wkcol-l{border-right:none}
}
/* 周复盘归档 */
.wkst{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);border-radius:999px;
  padding:3px 10px;border:1px solid var(--line);color:var(--ink-400)}
.wkst.done{border-color:var(--pri-400);color:var(--pri);background:var(--pri-050)}
.wklock{display:flex;align-items:center;gap:8px;justify-content:center;font-size:var(--fs-sm);
  color:var(--pri);background:var(--pri-050);border:1px solid var(--pri-400);border-radius:var(--r-md);
  padding:12px 14px;margin:var(--sp-5) 0}
.ro-val{background:var(--paper-2);border:1px dashed var(--line);border-radius:var(--r-sm);
  padding:10px 12px;font-size:var(--fs-sm);line-height:1.7;color:var(--ink-700);white-space:pre-wrap}
.ro-val .dim{color:var(--ink-300)}
.wkhist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 var(--sp-4);
  padding-top:var(--sp-3);border-top:1px solid var(--line-soft)}
/* 仅「回看」页那条整行居中；「复盘」页的「近期」条保持左对齐 */
.wkhist.center{justify-content:center}
.wkhist .h{font-size:var(--fs-xs);color:var(--ink-400);margin-right:2px}
.wkhist .c{font-size:var(--fs-xs);border:1px solid var(--line);border-radius:999px;padding:3px 9px;
  color:var(--ink-400);cursor:pointer;transition:.2s var(--ease);background:var(--surface);font-family:inherit}
.wkhist .c:hover{border-color:var(--pri-400)}
.wkhist .c.done{border-color:var(--pri);color:var(--pri);background:var(--pri-050)}
.wkhist .c.cur{box-shadow:0 0 0 2px var(--pri-050)}
.wkhist .c.none{color:var(--ink-200);cursor:default}
.wkhist .c.none:hover{border-color:var(--line)}

/* ============ 复盘 Tab / 月度复盘 / 情绪词条 ============ */
.segbar{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;
  background:var(--surface);margin:0 0 var(--sp-4)}
.segbar button{padding:6px 20px;border-radius:999px;font-size:var(--fs-sm);
  color:var(--ink-500);font-family:inherit;transition:.22s var(--ease)}
.segbar button.on{background:var(--pri);color:#fff}
.moov{background:var(--paper-2);border:1px solid var(--line-soft);border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4)}
.moov .k{font-size:var(--fs-xs);color:var(--ink-400);margin-bottom:6px;letter-spacing:.04em}
.moov .v{font-size:var(--fs-sm);color:var(--ink-700)}
.moov .chips{justify-content:flex-start;margin-top:10px;gap:6px}
.emoq{width:100%;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--paper-2);font-size:var(--fs-sm);font-family:inherit;outline:none;transition:.2s var(--ease)}
.emoq:focus{border-color:var(--pri-400);background:var(--surface)}
.emowrap{margin-top:var(--sp-3)}
.emowrap .wheel{max-width:250px;display:block;margin:0 auto}
.emowrap .wcol{max-width:440px;margin:var(--sp-3) auto 0;text-align:left}
.emolv{font-size:var(--fs-xs);color:var(--ink-300);letter-spacing:.06em;margin:8px 0 4px}
.emotag{font-size:var(--fs-xs);padding:4px 11px;margin:0 6px 6px 0;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-600);
  font-family:inherit;transition:.2s var(--ease)}
.emotag:hover{border-color:var(--pri-400);color:var(--pri);background:var(--pri-050)}
.emotag.on{border-color:var(--pri);color:var(--pri);background:var(--pri-050)}
.emores{display:flex;flex-wrap:wrap;margin-top:8px;text-align:left}
.emohint{font-size:var(--fs-xs);color:var(--ink-300);line-height:1.75;margin-top:6px;text-align:left}
.emocustom{display:flex;gap:8px;margin-top:10px;align-items:center}
.emocustom input{flex:1;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--paper-2);font-size:var(--fs-sm);font-family:inherit;outline:none;transition:.2s var(--ease)}
.emocustom input:focus{border-color:var(--pri-400);background:var(--surface)}

/* ============ 月度复盘 · 全年一览表（12 月 × 内心/行动/结果/备注） ============ */
.mobar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:var(--sp-4) 0 8px}
.moyr{display:flex;align-items:center;gap:2px}
.moyr .y{font-size:var(--fs-md);font-weight:600;color:var(--ink-800);min-width:78px;text-align:center}
.moviews{display:flex;gap:6px}
.moview{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:var(--fs-sm);
  color:var(--ink-500);background:var(--surface);font-family:inherit;cursor:pointer;transition:.2s var(--ease)}
.moview.on{border-color:var(--pri);background:var(--pri-050);color:var(--pri);font-weight:600}
.mtblwrap{position:relative;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);margin-bottom:var(--sp-4)}
.mtbl{width:100%;border-collapse:collapse;table-layout:fixed}
.mtbl th{background:var(--paper-2);font-size:var(--fs-xs);color:var(--ink-400);font-weight:500;
  letter-spacing:.04em;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);
  border-right:1px solid var(--line-soft)}
.mtbl th:last-child{border-right:none}
.mtbl th.mc,.mtbl td.mc{width:66px;text-align:center}
.mtbl td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
  padding:5px 7px;vertical-align:top}
.mtbl td:last-child{border-right:none}
.mtbl tbody tr:last-child td{border-bottom:none}
.mtbl td.mc{font-size:var(--fs-sm);color:var(--ink-500);font-weight:600;background:var(--paper-2)}
.mtbl tr.cur td{background:var(--pri-050)}
.mtbl tr.cur td.mc{color:var(--pri);background:var(--pri-050)}
.mtbl .doney{font-size:var(--fs-xs);color:var(--acc);display:block;font-weight:400;margin-top:2px}
/* 单元格：编辑态 */
.mcell{display:block;width:100%;border:none;background:transparent;resize:none;outline:none;
  font-family:inherit;font-size:var(--fs-sm);line-height:1.65;color:var(--ink-700);
  padding:5px 6px;border-radius:var(--r-xs);min-height:58px;overflow:hidden;
  transition:background .18s var(--ease),box-shadow .18s var(--ease)}
.mcell::placeholder{color:var(--ink-200)}
.mcell:hover{background:var(--paper-2)}
.mcell:focus{background:var(--surface);box-shadow:inset 0 0 0 1px var(--pri-400)}
/* 单元格：只读态 */
.mro{padding:5px 6px;min-height:58px;font-size:var(--fs-sm);line-height:1.7;color:var(--ink-700)}
.mro .ln{display:block;padding-left:12px;position:relative;margin-top:2px}
.mro .ln:first-child{margin-top:0}
.mro .ln::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--ink-200)}
.midle{padding:5px 6px;min-height:58px;font-size:var(--fs-xs);color:var(--ink-200)}
/* 联结模式下整格可点 */
.mtbl td.cellm{cursor:pointer;transition:background .18s var(--ease)}
.mtbl td.cellm:hover{background:var(--paper-2)}
.mtbl td.anchor{background:var(--acc-050);box-shadow:inset 0 0 0 2px var(--acc)}
/* 跨月箭头层 */
.moarrows{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:2}
.moarrows .mdot{pointer-events:auto;cursor:pointer}
.moLinks{margin-bottom:var(--sp-4)}
.moLinks .lt{font-size:var(--fs-xs);color:var(--ink-400);letter-spacing:.04em;margin-bottom:6px}

/* 网格项允许收缩，避免释义区 nowrap 撑宽整页 */
.steps>.stepcol{min-width:0}
.fcard{min-width:0}

/* ============ 情绪标记：块区 / 快速行 / 释义区 / 弹窗 ============ */
.fcedit{position:relative;min-height:103px;white-space:pre-wrap;word-break:break-word;
  line-height:1.78;text-align:left;padding:var(--sp-3)}
/* 占位用绝对定位层，不进入文字流，避免光标被推到占位文字之后 */
.fcedit.is-empty::after{content:attr(data-ph);position:absolute;left:var(--sp-3);
  right:var(--sp-3);top:var(--sp-3);color:var(--ink-300);pointer-events:none;
  white-space:pre-wrap;word-break:break-word}
.tok{display:inline-flex;align-items:center;gap:4px;background:var(--pri-050);color:var(--pri);
  border-radius:999px;padding:1px 9px;font-size:var(--fs-xs);line-height:1.75;margin:0 2px;
  vertical-align:baseline;user-select:none}
.tok i{font-style:normal;opacity:.45;cursor:pointer;font-size:14px;line-height:1;
  padding:0 3px;margin-right:-3px;border-radius:50%}
.tok i:hover,.tok i:focus{opacity:1;outline:none;background:rgba(69,89,75,.12)}
.emq{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp-3);align-items:center}
.eqt{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:3px 11px;font-family:inherit;font-size:var(--fs-xs);color:var(--ink-500);
  cursor:pointer;transition:.16s var(--ease)}
.eqt:hover{border-color:var(--pri-400);color:var(--pri)}
.eqt.on{background:var(--pri);border-color:var(--pri);color:#fff}
.eqt.more{border-style:dashed;color:var(--ink-300)}
.meanlist{margin-top:var(--sp-3);border-top:1px solid var(--line-soft)}
.meanrow{display:flex;align-items:baseline;gap:12px;padding:7px 2px;
  border-bottom:1px solid var(--line-soft)}
.meanrow .w{flex:none;width:60px;font-size:var(--fs-xs);font-weight:600;color:var(--pri);line-height:1.5}
.meanrow .w span{display:block;font-size:10px;color:var(--ink-300);font-weight:400}
.meanrow .i{flex:1;min-width:0;overflow:hidden;display:flex;align-items:baseline;gap:9px;
  font-size:var(--fs-xs);color:var(--ink-600);line-height:1.6;white-space:nowrap}
.meanrow .i>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meanrow .i .c{flex:none;color:var(--ink-300);font-size:11.5px}
.meanrow .i .m{flex:0 1 auto}
.meanrow .i .e{flex:1 1 0%;color:var(--ink-400);font-size:11.5px}
/* 弹窗 */
.emomask{position:fixed;inset:0;z-index:95;background:rgba(27,32,29,.42);
  display:flex;align-items:center;justify-content:center;padding:20px}
.emopanel2{width:100%;max-width:800px;max-height:86vh;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden}
.emohd{display:flex;align-items:center;gap:10px;padding:14px 18px 11px;
  border-bottom:1px solid var(--line-soft)}
.emohd .t{font-size:var(--fs-md);font-weight:600}
.emohd .s{font-size:11px;color:var(--ink-300)}
.emohd .x{margin-left:auto;border:none;background:none;font-size:20px;line-height:1;
  color:var(--ink-400);cursor:pointer;padding:2px 7px;border-radius:8px}
.emohd .x:hover{background:var(--paper-2);color:var(--ink-900)}
.emosearch{padding:11px 18px 3px}
.emosearch input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper-2);font-family:inherit;font-size:var(--fs-sm);outline:none;color:var(--ink-800)}
.emosearch input:focus{border-color:var(--pri-400);background:var(--surface)}
.emogrid{padding:6px 18px 12px;overflow:auto;flex:1 1 auto}
.emoaxis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-300);margin:2px 0 7px}
.emquads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.emquads{grid-template-columns:1fr}}
.emquad{border-radius:var(--r-sm);padding:8px 9px 9px;border:1px solid rgba(0,0,0,.05)}
.emquad.q1{background:#F3E4DE}.emquad.q2{background:#E2E8EB}
.emquad.q3{background:#E6EDE3}.emquad.q4{background:#F5EFDC}
[data-theme="dark"] .emquad.q1{background:#3A2C27}
[data-theme="dark"] .emquad.q2{background:#252D32}
[data-theme="dark"] .emquad.q3{background:#252E27}
[data-theme="dark"] .emquad.q4{background:#332E22}
.emquad .qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.emquad .qn{font-size:var(--fs-xs);font-weight:600;color:var(--ink-800)}
.emquad .qs{font-size:10px;color:var(--ink-400)}
.ecells{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ecell{position:relative;border:none;border-radius:7px;background:rgba(255,255,255,.68);
  color:var(--ink-700);font-family:inherit;font-size:11px;padding:6px 2px;cursor:pointer;
  line-height:1.25;transition:.14s var(--ease);text-align:center}
[data-theme="dark"] .ecell{background:rgba(255,255,255,.10);color:var(--ink-700)}
.ecell:hover{background:#fff;transform:translateY(-1px)}
.ecell.on{background:var(--pri);color:#fff}
.ecell.on::after{content:'✓';position:absolute;top:0;right:2px;font-size:8px;opacity:.75}
.ecell.dim{opacity:.24}
.ecell.hit{box-shadow:0 0 0 2px var(--acc) inset}
.emofoot{display:flex;align-items:center;gap:9px;padding:10px 18px;
  border-top:1px solid var(--line-soft);background:var(--paper-2)}
.emofoot .s{flex:1;font-size:var(--fs-xs);color:var(--ink-500);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.emofoot .s b{font-weight:600;color:var(--pri)}
.emofoot .btn[disabled]{opacity:.45;cursor:not-allowed}

<script>
/* =====================================================================
   《观自在》每日记录 · 单文件 MVP
   工程范式沿用用户的 todolist：单文件 HTML + localStorage + GitHub 云同步
   代码从零编写，业务按《复盘自己》[日]山田智惠 的 8 栏真实结构实现
   ===================================================================== */

/* ---------- §2 配置：8 栏（书摘核对后锁定，改配置即改全局） ---------- */
var FIELDS = [
  { step:1, no:'①', key:'event', label:'事件', guide:'什么事件让你内心有所触动？积极或消极都可以。',
    required:true, splitCheck:'fact',
    placeholder:'只写发生的客观事实。先完整写下来，再看看有没有夹杂感受或判断——有的话，挪到 ② 去。',
    rows:3 },

  { step:1, no:'②', key:'thoughts', label:'当时的想法和感受', guide:'事件发生时，你产生了什么念头？感受到了什么？',
    required:true, emotionWheel:true,
    placeholder:'写真心话。暂时搁下"我这样写会不会不太好"的顾虑，如实写下脑海与心中闪过的内容。',
    rows:3 },

  { step:1, no:'③', key:'action', label:'行动', guide:'当时你采取了什么行动？（若未采取任何行动，可留空）',
    required:false, placeholder:'例：我表情严肃，听取了那位成员的报告。', rows:2 },

  { step:1, no:'④', key:'result', label:'结果', guide:'当时的行动带来了什么结果？',
    required:false, placeholder:'例：那位成员情绪低落，我也在反复思考这样的处理是否妥当。', rows:2 },

  { step:2, no:'①-A', key:'reframe', label:'重新注意到了什么', guide:'回顾事件及左侧所写的内容，你重新注意到了什么？',
    required:true,
    tip:'你已经不在当时那个需要马上反应的情境里了。可以站在自己的角度、对方的角度，甚至第三者的角度重新审视。',
    placeholder:'有没有不同的看法？是否可以尝试新的思考角度？', rows:3 },

  { step:2, no:'②', key:'nextAction', label:'从现在开始可以采取的行动', guide:'从现在开始，你可以采取什么具体行动？',
    required:false, splitCheck:'self',
    tip:'只写仅靠"自己"就能做到的事。"我希望对方这样做"取决于对方，不算；改成"我计划与对方沟通看看"才算。',
    placeholder:'例：今后，我会在表述事实的基础上，传达自己的内心所想。', rows:2 },

  { step:2, no:'③', key:'nextResult', label:'这些行动可能会带来的结果', guide:'这些行动可能会带来怎样的结果？',
    required:false,
    tip:'只要有所行动，就一定会带来某种结果。即使看似"什么都没有发生"，那也是结果的一种，请如实记录下来。',
    placeholder:'例：给 A 发了信息，但过了 X 天都没有回应。', rows:2 },

  { step:2, no:'①-B', key:'selfDiscovery', label:'对自己的新发现', guide:'是否有关于自己的新发现？（可空）',
    required:false, collapsible:false,
    prompts:['我的心中为什么会产生那样的想法？','那一刻，我真正渴望的是什么？','是否还存在其他可选方式？'],
    placeholder:'判断标准只有一个：自己是否真心认同。能由衷说出"确实如此"，就是满分。', rows:3 }
];

/* 切分检测词表 */
var WORDS_FACT = ['我觉得','我感到','我感觉','我认为','我以为','我想他','我想她','很糟糕','太糟糕','不应该','不应该的',
  '真是','居然','竟然','开心','难过','生气','害怕','担心','失望','遗憾','后悔','讨厌','喜欢','郁闷','烦躁','焦虑',
  '委屈','尴尬','自责','无助','崩溃','烦死了','过分','不合理','很不好','太差','很不爽','很失落','很紧张','很生气','很难过'];
var WORDS_SELF = ['希望对方','希望他','希望她','希望他们','让他','让她','叫他们','叫他','叫她','取得信任','赢得信任',
  '得到认可','被认可','得到理解','别人会','他会','她会','他们能','对方能','对方会','大家能','大家会','改变他','改变她',
  '他应该','她应该','让他们','让他们能','获得好评','被看见'];

var EMO_QUADS = [
  { key:'q1', name:'愤怒 · 恐惧', sub:'高能量 · 低愉悦', words:[
    ['暴怒','Enraged','愤怒 + 高唤醒','被反复冒犯到极点','第三次改稿还被删，我差点摔了键盘。'],
    ['恐慌','Panicked','恐惧 + 失控','危险逼近而退无可退','电梯突然下坠，我脑子一片空白。'],
    ['压力','Stressed','恐惧 + 期待','要交付，但我不确定做得到','明天汇报，我半夜还在改第 8 版。'],
    ['紧绷','Jittery','恐惧 + 警觉','一直提着，放不下来','等结果那两天，我肩膀一直是僵的。'],
    ['吃惊','Shocked','惊讶 + 高唤醒','现实与预期差得太远','领导突然说项目归我，我愣在那儿。'],
    ['狂怒','Livid','愤怒 + 受阻','怒到说不出话','有人删了我做一周的表，我没吭声。'],
    ['愤懑','Furious','愤怒 + 无力','占理却没处说','功劳被拿走，我只能笑着点头。'],

}

function lsGet(k, dft){
  try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : dft; }
  catch(e){ return dft; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ toast('这个浏览器存不下记录了，换普通模式就能保存'); return false; }
}
function storageOK(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }
  catch(e){ return false; }
}

function loadAll(){
  S.records = normalizeAll(lsGet(K.rec, {}) || {});
  S.wk      = lsGet(K.wk, {}) || {};
  S.mo      = lsGet(K.mo, {}) || {};
  S.mlinks  = lsGet(K.mlink, []) || [];
  S.prefs   = Object.assign({ theme:'light', lastExport:0, autoBackup:true, lastAutoBackup:'' }, lsGet(K.prefs, {}));
  S.gh      = Object.assign({ token:'', owner:'', repo:'', path:'review-data.json', branch:'main' }, lsGet(K.gh, {}));
  document.documentElement.setAttribute('data-theme', S.prefs.theme || 'light');
}
/* 本地滚动备份：每日记录 + 周度复盘一起留一份，恢复时一并还原 */
function saveBackup(){
  lsSet(K.bak, { at:Date.now(), records:S.records, weeks:S.wk, months:S.mo, mlinks:S.mlinks });
}
function saveRecords(){
  lsSet(K.rec, S.records);
  saveBackup();
}
/* 周度复盘数据独立落盘：只写它自己的 key，不触碰 records */
function saveWk(){
  lsSet(K.wk, S.wk);
  saveBackup();
  if(!S._pulling) autoPushWk();      /* 拉取合并过程中不回推，避免与云端来回打架 */
}
var _wt;
function debounceWk(){ clearTimeout(_wt); _wt = setTimeout(saveWk, 800); }
/* 月度复盘数据同样独立落盘，与 weekly / records 互不影响 */
function saveMo(){
  lsSet(K.mo, S.mo);
  saveBackup();
  if(!S._pulling) autoPushWk();
}
var _mt;
function debounceMo(){ clearTimeout(_mt); _mt = setTimeout(saveMo, 800); }
/* 月度联结（跨月跨栏）独立落盘：a/b 形如 'YYYY-MM|field' */
function saveMlinks(){
  lsSet(K.mlink, S.mlinks);

  if(!S._pulling) autoPushWk();
}
var _mlt;
function debounceMlinks(){ clearTimeout(_mlt); _mlt = setTimeout(saveMlinks, 800); }
/* 周复盘改动后，若已配置云端则静默回推（与每日记录保存后的回推行为一致）；
   1500ms 防抖，连续编辑只在停下来后推一次。 */
var _wpt;
function autoPushWk(){
  if(!(S.gh.token && S.gh.owner && S.gh.repo)) return;
  clearTimeout(_wpt);

}

function weekDays(monday){ var out=[], i; for(i=0;i<7;i++) out.push(shiftDay(monday,i)); return out; }
/* 该周（周一起）有内容的条目 */
function weekEntries(monday){
  var out = [];
  weekDays(monday).forEach(function(d){
    dayEntries(d).forEach(function(e){ if(hasContent(e)) out.push(e); });
  });
  return out;
}
/* 取（必要时初始化）某周的复盘对象 */
function reviewOf(monday){
  if(!S.wk[monday]) S.wk[monday] = { focus:[], links:[], abs:{}, actions:[], updatedAt:0, done:false, doneAt:0, snap:null };
  var r = S.wk[monday];
  if(!Array.isArray(r.focus)) r.focus = [];
  if(!Array.isArray(r.links)) r.links = [];
  if(!Array.isArray(r.actions)) r.actions = [];
  if(!r.abs || typeof r.abs !== 'object') r.abs = {};
  r.done = !!r.done;                                   /* 归档后只读，用于区分「已完成」与「草稿」 */
  if(typeof r.doneAt !== 'number') r.doneAt = 0;
  return r;
}

/* 某周是否有记录（首页入口判断用） */
function weekRecordedDays(monday){
  return weekDays(monday).filter(function(d){ return doneEntries(d).length > 0; }).length;
}

/* ---------- §3c 月度复盘：取数与统计 ---------- */
function curYM(){ return today().slice(0,7); }
function ymCN(ym){ var p = String(ym).split('-'); return (+p[0])+' 年 '+(+p[1])+' 月'; }
function shiftYM(ym, n){
  var p = String(ym).split('-'), d = new Date(+p[0], +p[1]-1+n, 1);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
}
function monthDays(ym){
  var p = String(ym).split('-'), n = new Date(+p[0], +p[1], 0).getDate(), out = [], i;
  for(i=1;i<=n;i++) out.push(ym+'-'+('0'+i).slice(-2));
  return out;
}
/* 该月有内容的条目（升序） */
function monthEntries(ym){
  var out = [];
  Object.keys(S.records).forEach(function(d){
    if(String(d).slice(0,7) !== ym) return;
    dayEntries(d).forEach(function(e){ if(hasContent(e)) out.push(e); });
  });
  out.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  return out;
}
function monthRecordedDays(ym){
  return monthDays(ym).filter(function(d){ return doneEntries(d).length > 0; }).length;
}
/* 该月应有的周复盘数（= 该月的周一数）与已完成数 */
function monthWeekCount(ym){
  return monthDays(ym).filter(function(d){ return parseYmd(d).getDay() === 1; }).length;
}
function monthWeeksDone(ym){
  return Object.keys(S.wk).filter(function(k){
    return String(k).slice(0,7) === ym && S.wk[k] && S.wk[k].done;
  }).length;
}
/* 取（必要时初始化）某月的复盘对象 */
function monthReview(ym){
  if(!S.mo[ym]) S.mo[ym] = { inner:'', action:'', result:'', note:'', done:false, doneAt:0, updatedAt:0, snap:null };
  var r = S.mo[ym];
  ['inner','action','result','note'].forEach(function(k){ if(typeof r[k] !== 'string') r[k] = ''; });
  r.done = !!r.done;
  if(typeof r.doneAt !== 'number') r.doneAt = 0;
  if(typeof r.updatedAt !== 'number') r.updatedAt = 0;
  return r;
}
/* 情绪统计：同一条记录内重复只算一次；返回 { words:[{w,n,cls}], cls:[{cls,n}] } */
function monthEmoStat(ym){
  var m = {}, i;
  monthEntries(ym).forEach(function(e){
    var seen = {};
    (e.emotions || []).forEach(function(w){
      if(!w || seen[w]) return;
      seen[w] = 1;
      m[w] = (m[w] || 0) + 1;
    });
  });
  var words = Object.keys(m).map(function(w){ return { w:w, n:m[w], cls:emoClassOf(w) }; });
  words.sort(function(a,b){ return b.n - a.n || (a.w < b.w ? -1 : 1); });
  var box = {};
  words.forEach(function(x){ box[x.cls] = (box[x.cls] || 0) + x.n; });
  var cls = Object.keys(box).map(function(k){ return { cls:k, n:box[k] }; });
  cls.sort(function(a,b){ return b.n - a.n; });
  return { words:words, cls:cls };
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* 旧数据迁移：早期版本一天一个对象，统一升级为数组。
   关键：v1.1 的 id 是 number 类型，渲染进 onclick 后变 string，
   若不同一为 string，findEntry 用 === 严格比较会匹配失败（编辑/删除静默失效）。
   此处统一转字符串，一次性治好存量数据。 */
function normEntry(r){
  if(!r || typeof r !== 'object') return null;
  if(!r.id){ r.id = uid(); }
  else if(typeof r.id !== 'string'){ r.id = String(r.id); }   /* BUG-修复：数字id统一转字符串 */
  if(!Array.isArray(r.emotions)) r.emotions = [];
  FIELDS.forEach(function(f){ if(typeof r[f.key] !== 'string') r[f.key] = ''; });
  r.isDraft = !!r.isDraft;
  return r;
}
function toList(v){
  var arr = Array.isArray(v) ? v : (v ? [v] : []);
  return arr.map(normEntry).filter(function(x){ return !!x; });
}
function normalizeAll(obj){
  var out = {};
  Object.keys(obj || {}).forEach(function(k){
    var l = toList(obj[k]);
    if(l.length) out[k] = l;
  });
  return out;
}

/* 返回该天条目数组的真实引用，可 push / splice */
function dayEntries(date){
  var l = S.records[date];
  if(!Array.isArray(l)) l = S.records[date] = toList(l);
  return l;
}
/* 查找条目：id 统一按字符串比较，避免 number/string 混用导致匹配失败（=== 会误判） */
function findEntry(date, id){
  if(id === null || id === undefined) return null;
  var s = String(id);
  var l = dayEntries(date), i;
  for(i=0;i<l.length;i++) if(l[i].id && String(l[i].id) === s) return l[i];
  return null;
}
/* 只知道 id 时，全局定位它属于哪一天（清单/搜索跨日期跳转用） */
function locateEntry(id){
  if(!id) return null;
  var ds = Object.keys(S.records), i;
  for(i=0;i<ds.length;i++) if(findEntry(ds[i], id)) return ds[i];
  return null;
}
function newEntry(date){
  var e = { id:uid(), date:date, emotions:[], isDraft:true, createdAt:0, updatedAt:0 };
  FIELDS.forEach(function(f){ e[f.key] = ''; });
  return e;
}
/* 编辑页取"当前条目"：优先 S.entryId，其次该天最后一个草稿，否则新建一条 */
function curEntry(){
  if(!S.date) S.date = today();
  var l = dayEntries(S.date);
  if(S.entryId){
    var e = findEntry(S.date, S.entryId);
    if(e) return e;
  }
  var draft = null, i;
  for(i=l.length-1;i>=0;i--){ if(l[i].isDraft){ draft = l[i]; break; } }
  if(!draft){ draft = newEntry(S.date); l.push(draft); }
  S.entryId = draft.id;
  return draft;
}
/* 清理没写任何内容的空条目（保留正在编辑的那条） */
function pruneEmpty(date){
  if(!date) return;
  var l = dayEntries(date), i;
  for(i=l.length-1;i>=0;i--){
    var e = l[i];
    if(e && !hasContent(e) && e.id !== S.entryId) l.splice(i, 1);
  }
  if(!l.length) delete S.records[date];
}
/* 该天已完成的条目（非草稿且有内容） */
function doneEntries(date){
  return dayEntries(date).filter(function(e){ return e && !e.isDraft && hasContent(e); });
}
/* 不设上限：想记几条就记几条 */
function canAddMore(){ return true; }
function draftEntries(date){
  return dayEntries(date).filter(function(e){ return e && e.isDraft && hasContent(e); });
}
/* 全部条目，扁平化按日期+创建时间排序，用于导出/推送 */
function allEntries(){
  var out = [];
  Object.keys(S.records).forEach(function(d){
    dayEntries(d).forEach(function(e){ if(e && hasContent(e)) out.push(e); });
  });
  out.sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.createdAt||0) - (b.createdAt||0);
  });
  return out;
}
/* 有过记录（至少一条已完成）的日期，升序 */
function recordedDays(){
  return Object.keys(S.records).filter(function(d){ return doneEntries(d).length > 0; }).sort();
}
/* 兼容旧导出格式：{ 'YYYY-MM-DD': entry } 或 { date: [entry,...] } → 拍平成条目数组 */
function flattenGrouped(obj){
  var out = [];
  Object.keys(obj || {}).forEach(function(k){
    var v = obj[k];
    if(Array.isArray(v)) v.forEach(function(e){ out.push(e); });
    else if(v && typeof v === 'object') out.push(v);
  });
  return out;
}
/* 合并远端/导入的条目：按 id 匹配，同 id 取 updatedAt 较新 */
function mergeEntries(list){
  var added = 0, upd = 0;
  (list || []).forEach(function(raw){
    var r = normEntry(raw);
    if(!r || !r.date) return;
    var l = dayEntries(r.date);
    var hit = findEntry(r.date, r.id);
    if(!hit){ l.push(r); added++; return; }
    if((r.updatedAt||0) > (hit.updatedAt||0)){ l[l.indexOf(hit)] = r; upd++; }
  });
  return { added:added, upd:upd };
}
/* 合并远端/导入的周度复盘：按周（周一日期）匹配，同一周取 updatedAt 较新 */
function mergeWeeks(remoteWeeks){
  var added = 0, upd = 0;
  Object.keys(remoteWeeks || {}).forEach(function(k){
    var rw = remoteWeeks[k];
    if(!rw || typeof rw !== 'object') return;
    var lw = S.wk[k];
    if(!lw){ S.wk[k] = rw; added++; return; }
    if((rw.updatedAt||0) > (lw.updatedAt||0)){ S.wk[k] = rw; upd++; }
  });
  return { added:added, upd:upd };
}
/* 合并远端/导入的月度复盘：按月（YYYY-MM）匹配，同一月取 updatedAt 较新 */
function mergeMonths(remoteMonths){
  var added = 0, upd = 0;
  Object.keys(remoteMonths || {}).forEach(function(k){
    var rm = remoteMonths[k];
    if(!rm || typeof rm !== 'object') return;
    var lm = S.mo[k];
    if(!lm){ S.mo[k] = rm; added++; return; }
    if((rm.updatedAt||0) > (lm.updatedAt||0)){ S.mo[k] = rm; upd++; }
  });
  return { added:added, upd:upd };
}
/* 月度联结合并：按 a|b 去重；本地没有原因而远端有时，补上原因 */
function mergeMlinks(remoteLinks){
  var added = 0, upd = 0;
  (remoteLinks || []).forEach(function(l){
    if(!l || !l.a || !l.b) return;
    var hit = null;
    for(var i=0;i<S.mlinks.length;i++){
      var x = S.mlinks[i];
      if((x.a === l.a && x.b === l.b) || (x.a === l.b && x.b === l.a)){ hit = x; break; }
    }
    if(!hit){ S.mlinks.push({ a:l.a, b:l.b, cause:l.cause || '' }); added++; return; }
    if(!hit.cause && l.cause){ hit.cause = l.cause; upd++; }
  });
  return { added:added, upd:upd };
}
/* 解析备份/云端 JSON 载荷，兼容四类格式：
   ① v3/v4 对象 { v:4, records:[...], weeks:{...}, months:{...}, mlinks:[...] }（当前）
   ② 裸数组 allEntries()（v1.1 及更早）
   ③ 按日期分组的对象（更早的 grouped 格式）
   ④ 早期无 mlinks 字段的对象（mlinks 返回 null） */
function parsePayload(data){
  if(Array.isArray(data)) return { list:data, weeks:null, months:null, mlinks:null };
  if(data && data.records) return { list:flattenGrouped(data.records), weeks:data.weeks || null,
                                    months:data.months || null, mlinks:data.mlinks || null };
  return { list:flattenGrouped(data), weeks:null, months:null, mlinks:null };
}

function filledCount(r){
  if(!r) return 0;
  return FIELDS.filter(function(f){ return String(r[f.key]||'').trim(); }).length;
}
function hasContent(r){ return filledCount(r) > 0; }

/* ---------- 工具 ---------- */
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ymd(d){ d = d || new Date();
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function parseYmd(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
var WD = ['日','一','二','三','四','五','六'];
function dateCN(s){ var d = parseYmd(s); return (d.getMonth()+1)+' 月 '+d.getDate()+' 日 星期'+WD[d.getDay()]; }
function today(){ return ymd(new Date()); }
function shiftDay(s, n){ var d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
/* 该日期所在周的周一（周一为一周起点），用作"本周是否已备份"的周标识 */
function mondayOf(s){
  var d = parseYmd(s || today());
  var wd = (d.getDay() + 6) % 7;            // 周一=0 … 周日=6
  d.setDate(d.getDate() - wd);
  return ymd(d);
}

var _tt;
function toast(msg, ms){
  var el = document.getElementById('toast');
  el.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(_tt);
  _tt = setTimeout(function(){
    var t = el.querySelector('.toast'); if(t) t.classList.add('out');
    setTimeout(function(){ el.innerHTML = ''; }, 280);
  }, ms || 2400);
}


/* ---------- §5 切分检测 ---------- */
function splitHit(text, mode){
  var list = mode==='fact' ? WORDS_FACT : WORDS_SELF;
  var hits = [];
  list.forEach(function(w){ if(text.indexOf(w) >= 0) hits.push(w); });
  return hits;
}
function splitMsg(mode, hits){
  if(mode==='fact')
    return '这里出现了「'+hits.slice(0,3).join('、')+'」——看起来是感受或判断。' +
           '可以把它们挪到「② 当时的想法和感受」，让这一栏只留下客观事实。';
  return '「'+hits.slice(0,3).join('、')+'」能否实现，取决于对方而不是你自己。' +
         '试试改成「我计划…」「我将尝试…」这样只靠自己就能做到的表述？';
}

/* ---------- §5 正反馈：规则化提取，绝不编造 ---------- */
function feedbackOf(r){
  var sd = String(r.selfDiscovery||'').trim();
  var rf = String(r.reframe||'').trim();
  if(sd) return { text:sd, kind:'self' };
  if(rf) return { text:rf, kind:'reframe' };
  return { text:'', kind:'none' };
}
var ENCO = ['又多看见了自己一点','这一次，你如实记录了下来','写下来，就已经是开始','你今天没有跳过自己'];
function encoOf(r){
  if(!r) return ENCO[0];
  var n = recordedDays().length;
  if(n<=1) return '又多看见了自己一点';
  if(n<=7) return '第 '+n+' 天，你又一次看见了自己';
  return '已经 '+n+' 天了，这些记录正在慢慢变成你自己的财富';
}

/* ---------- §4 渲染 ---------- */
function render(){
  var v = document.getElementById('view');
  var p = S.page;
  if(p==='home')          v.innerHTML = viewHome();
  else if(p==='record')   v.innerHTML = viewRecord();
  else if(p==='feedback') v.innerHTML = viewFeedback();
  else if(p==='calendar') v.innerHTML = viewCalendar();
  else if(p==='detail')   v.innerHTML = viewDetail();
  else if(p==='review')   v.innerHTML = viewReview();
  else                    v.innerHTML = viewSettings();

  document.querySelectorAll('.nav button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-nav')===p ||
      (p==='record' && b.getAttribute('data-nav')==='home'));
  });
  // 记录页/反馈页底部有操作条，隐藏导航避免遮挡
  var nav = document.querySelector('.nav');
  if(nav) nav.style.display = (p==='record' || p==='feedback') ? 'none' : 'flex';

  // 阅读型页面收窄；记录页与复盘页（周度跨页 / 月度年表）保持宽屏
  var app = document.querySelector('.app');
  if(app) app.classList.toggle('narrow', p!=='record' && p!=='review');
  if(p==='record') setTimeout(afterRecordRender, 0);
  if(p === 'review'){
    if(S.rvTab === 'month'){
      // 月度：先让多行格撑开，再按格子实际坐标画跨月箭头
      setTimeout(function(){ moAutoGrow(); drawMoArrows(); }, 0);
      if(!window.__moArrowBound){
        window.__moArrowBound = 1;
        window.addEventListener('resize', function(){
          if(S.page === 'review' && S.rvTab === 'month'){ moAutoGrow(); drawMoArrows(); }
        });
      }
    }else{
      // 周度：素材列渲染后按卡片实际坐标绘制联结箭头
      setTimeout(drawWkArrows, 0);
      if(!window.__wkArrowBound){
        window.__wkArrowBound = 1;
        window.addEventListener('resize', function(){
          if(S.page === 'review' && S.rvTab !== 'month') drawWkArrows();
        });
      }
    }
  }
  renderModal();
  renderEmoModal();
  window.scrollTo({ top:0 });
}

/* --- P1 首页 --- */
function viewHome(){
  var t = today(), y = shiftDay(t, -1);
  var td = doneEntries(t);                 // 今天已完成的条目
  var n = td.length;
  var yd = doneEntries(y);
  var days = recordedDays();
  var total = days.length;
  var streak = 0;
  if(total){
    var cur = doneEntries(t).length ? t : shiftDay(t, -1);
    while(doneEntries(cur).length){ streak++; cur = shiftDay(cur, -1); }
  }
  var h = new Date().getHours();
  var greet = h<6 ? '夜深了，慢慢来' : h<11 ? '早上好，今天也看见自己' : h<14 ? '中午好，停一下' : h<18 ? '下午好' : '晚上好，今天，看见自己';

  var s = '';
  s += '<div class="hero fade"><div class="d">'+dateCN(t)+'</div><div class="g">'+greet+'</div></div>';

  s += '<div class="card stat fade">';
  if(n > 0){
    s += '<div class="t">今天已经记下 '+n+' 条</div>';
    s += '<div class="s">还有别的触动你的事，也可以写下来。一天记多少条都行。</div>';
    s += '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
      +  '<button class="btn btn-ghost" onclick="W.openDay(\''+t+'\')">去回看</button>'
      +  '<button class="btn btn-pri" onclick="W.newEntry(\''+t+'\')">再记一条（第 '+(n+1)+' 条）</button>'
      +  '</div>';
  }else{
    var draft = draftEntries(t).length > 0;
    s += '<div class="t">'+(draft ? '上次没写完，已为你留着' : '从今天开始，看见自己')+'</div>';
    s += '<div class="s">选一件触动你的事，跟着八栏如实写下来。五分钟就够。</div>';
    s += '<div style="margin-top:20px"><button class="btn btn-pri btn-lg" onclick="W.go(\'record\',\''+t+'\')">开始今天的复盘</button></div>';
  }
  s += '</div>';

  if(total){
    var pct = Math.min(100, Math.round(streak/7*100)) || 8;
    var cnt = allEntries().length;
    s += '<div class="card fade" style="margin-top:14px;padding:18px 22px">'
      +  '<div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--sub2)">'
      +  '<span>已记录 '+total+' 天 · '+cnt+' 条</span><span>'+(streak>0 ? '最近连着 '+streak+' 天' : '随时可以重新开始')+'</span></div>'
      +  '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';

    s += '<div class="grid2 fade">';
    s += '<button class="tile" onclick="W.openDay(\''+y+'\')"><div class="tt">'+
         (yd.length ? '看昨天的记录' : '补记昨天')+'</div><div class="ts">'+dateCN(y)+'</div></button>';
    s += '<button class="tile" onclick="W.go(\'calendar\')"><div class="tt">回看记录</div><div class="ts">月历或清单，翻翻之前写下的</div></button>';
    s += '</div>';

    /* 本周复盘入口 */
    var rmon = mondayOf(t), rdays = weekRecordedDays(rmon), rv = S.wk[rmon];
    var rvDone = !!(rv && rv.done);
    s += '<div class="card fade wkentry" style="margin-top:14px">'
      +  '<div class="txt"><b style="color:var(--ink-800)">本周复盘</b>'
      +  (rvDone?' <span class="wkst done">✓ 已归档</span>':'')+'<br>'
      +  '<span style="color:var(--ink-400)">'+(rvDone ? '本周复盘已完成并归档' : (rdays ? ('这一周记录了 '+rdays+' 天，可以开始本周复盘了') : '这一周还没有记录，先去写几条'))+'</span></div>'
      +  '<button class="btn btn-ghost" style="flex:none" onclick="W.go(\'review\')">'+(rvDone ? '查看' : (rv && rv.updatedAt ? '继续本周复盘' : '开始本周复盘'))+'</button>'
      +  '</div>';
  }else{
    s += '<div class="empty fade"><span class="e">·</span>还没有任何记录<br>写下第一件事，就算开始了</div>';
  }
  return s;
}

/* --- P2 记录填写页 --- */

    +  '<div class="ti">'+dateCN(S.date)+'</div>'
    +  '<div class="dots">'+FIELDS.map(function(x){

  /* 条目指示：今天第几条，可左右切换 */
  if(l.length > 1){
    s += '<div class="entbar">'
      +  '<button class="iconbtn" onclick="W.swapEntry(-1)" title="上一条"'+(idx>0?'':' style="opacity:.25;pointer-events:none"')+'>'
      +  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'
      +  '<div class="lbl">今天第 <b>'+(idx+1)+'</b> 条 · 共 '+l.length+' 条</div>'
      +  '<button class="iconbtn" onclick="W.swapEntry(1)" title="下一条"'+(idx<l.length-1?'':' style="opacity:.25;pointer-events:none"')+'>'
      +  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>'
      +  '</div>';
  }else{
    s += '<div class="entbar"><div class="lbl">今天第 <b>1</b> 条</div></div>';
  }

  s += '<div class="steps" id="steps">';
  [1,2].forEach(function(step){
    s += '<div class="stepcol">';
    s += '<div class="stephead"><span class="n">'+(step===1?'第一步':'第二步')+'</span>'
      +  '<span class="s">'+(step===1?'记录':'意义重塑')+'</span></div>';
    FIELDS.filter(function(x){ return x.step===step; }).forEach(function(x){
      s += cardHTML(x, rec);
    });
    s += '</div>';
  });
  s += '</div>';

  s += '<div class="footbar">'
    +  '<div class="row"><button class="btn btn-pri btn-lg" onclick="W.save()">完成，保存</button>'
    +  '<button class="btn btn-ghost btn-lg" onclick="W.save(1)">保存，再记一条</button></div>'
    +  '<div class="hint">没写完也没关系，随时可以离开——已经自动存好了</div>'
    +  '</div>';
  return s;
}

var MO_FIELDS = [
  { k:'inner',  label:'内心', guide:'这个月，心里反复出现的是什么？', ph:'本月内心反复出现的声音…' },
  { k:'action', label:'行动', guide:'这个月做了什么、坚持了什么？',   ph:'本月实际采取的行动…' },
  { k:'result', label:'结果', guide:'这些行动带来了什么结果？',       ph:'本月的成果或反馈…' },

];

  '例如：入职半年，终于逐渐适应，可以专注地投入工作了。',
  '例如：准备再用一个月完成断舍离！',
  '例如：通过养成复盘的习惯，心态变得越来越积极了。'
];
var MO_CAUSE_PH = '是什么促成了这个联结？上个月的某个行动，也许就是本月某个结果的原因 —— 其中的关键因素究竟是什么？';
function moView(){ return S.moView === 'month' ? 'month' : 'year'; }

   否则空月份会被写入并同步到云端 */
function moGet(ym){
  var r = S.mo[ym];
  if(!r) return { inner:'', action:'', result:'', note:'', done:false, doneAt:0, updatedAt:0 };
  return { inner:r.inner || '', action:r.action || '', result:r.result || '', note:r.note || '',
           done:!!r.done, doneAt:r.doneAt || 0, updatedAt:r.updatedAt || 0 };

function moModeOf(){ return S.moMode === 'link' ? 'link' : 'focus'; }
function moFieldLabel(f){
  for(var i=0;i<MO_FIELDS.length;i++) if(MO_FIELDS[i].k === f) return MO_FIELDS[i].label;
  return f;
}
function moKey(ym, f){ return ym + '|' + f; }
function moSplitKey(k){ var p = String(k||'').split('|'); return { ym:p[0] || '', f:p[1] || '' }; }

function moCellHtml(ym, f, mi, mode){
  var r = moGet(ym);

  var ro = !!r.done;
  var key = moKey(ym, f);
  var anchor = (S.moLinkA === key);
  if(mode === 'link' && !ro){
    var body = moLines(v).length
      ? moLines(v).map(function(x){ return '<span class="ln">' + esc(x) + '</span>'; }).join('')
      : '—';
    return '<td class="cellm' + (anchor ? ' anchor' : '') + '" data-mk="' + esc(key) + '"'
      + ' onclick="W.moPick(\'' + key + '\')"><div class="mro">' + body + '</div></td>';
  }
  if(ro){
    return '<td data-mk="' + esc(key) + '">'
      + (moLines(v).length ? moLinesHtml(v) : '<div class="midle">—</div>') + '</td>';
  }
  var fdef = null;
  for(var i=0;i<MO_FIELDS.length;i++) if(MO_FIELDS[i].k === f) fdef = MO_FIELDS[i];
  /* 备注栏一直给例句提示；其他三栏只在当月行给提示，避免整表满是灰字 */
  var ph = (f === 'note') ? MO_NOTE_PH[(mi - 1) % MO_NOTE_PH.length]

/* 跨月箭头：按格子实际坐标画曲线，中点圆标可点开关键因素 */
function drawMoArrows(){
  var box = document.getElementById('mtblwrap'), svg = document.getElementById('moarrows');
  if(!box || !svg) return;
  var cs = getComputedStyle(document.documentElement);
  var acc = (cs.getPropertyValue('--acc') || '#A08D4E').trim();
  var surf = (cs.getPropertyValue('--surface') || '#FBFAF6').trim();
  var cells = {};
  [].forEach.call(box.querySelectorAll('td[data-mk]'), function(td){
    cells[td.getAttribute('data-mk')] = td;
  });
  var W = Math.max(box.clientWidth, 1), H = Math.max(box.clientHeight, 1);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.height = H + 'px';
  var b0 = box.getBoundingClientRect();
  function rect(td){
    var q = td.getBoundingClientRect();
    return { l:q.left - b0.left, t:q.top - b0.top, w:q.width, h:q.height };
  }
  var out = '<defs><marker id="moah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">'
    + '<path d="M0 0 L8 4 L0 8 z" fill="' + acc + '"/></marker></defs>';
  moLinksOfYear(moYearNow()).forEach(function(l){
    var ca = cells[l.a], cb = cells[l.b];
    if(!ca || !cb) return;
    var ra = rect(ca), rb = rect(cb);
    var rightward = (rb.l + rb.w / 2) > (ra.l + ra.w / 2);
    var x1 = rightward ? (ra.l + ra.w) : ra.l;
    var x2 = rightward ? rb.l : (rb.l + rb.w);
    var y1 = ra.t + ra.h / 2, y2 = rb.t + rb.h / 2;
    var dx = rightward ? 46 : -46;
    var idx = S.mlinks.indexOf(l);
    out += '<path d="M' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + (y1 + (y2 - y1) * 0.35)
      + ', ' + (x2 - dx) + ' ' + (y2 - (y2 - y1) * 0.35) + ', ' + x2 + ' ' + y2 + '"'
      + ' fill="none" stroke="' + acc + '" stroke-width="1.6" opacity=".8" marker-end="url(#moah)"/>';
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    out += '<circle class="mdot" cx="' + mx + '" cy="' + my + '" r="7" fill="' + surf + '" stroke="'
      + acc + '" stroke-width="1.4"'
      + (idx < 0 ? '' : ' onclick="W.moLinkEdit(' + idx + ')"') + '><title>'
      + (l.cause ? '已写关键因素，点开查看' : '点开记录关键因素') + '</title></circle>';
    if(l.cause) out += '<circle cx="' + mx + '" cy="' + my + '" r="2.6" fill="' + acc + '" pointer-events="none"/>';
  });
  svg.innerHTML = out;
}

/* 近期周复盘状态条：✓ 已归档 / · 有记录未归档 / 灰 无记录；点击可跳转 */
function wkHistory(thisMon, cur){
  var s = '<div class="wkhist"><span class="h">近期</span>';
  var start = shiftDay(thisMon, -7 * 5);
  for(var i = 0; i < 6; i++){
    var m = shiftDay(start, i * 7);
    var recs = weekRecordedDays(m);
    var rv = S.wk[m];
    var done = !!(rv && rv.done);
    var has = recs > 0 || done;
    var cls = 'c' + (done ? ' done' : '') + (m === cur ? ' cur' : '') + (has ? '' : ' none');
    var lbl = (+m.slice(5,7)) + '/' + (+m.slice(8,10)) + (done ? ' ✓' : (recs > 0 ? ' ·' : ''));
    var tip = dateCN(m) + (done ? ' 已归档' : (recs > 0 ? ' 有记录 · 未归档' : ' 暂无记录'));
    s += '<button class="' + cls + '" title="' + tip + '"'
      +  (has ? ' onclick="W.gotoWeek(\'' + m + '\')"' : ' disabled')
      +  '>' + lbl + '</button>';
  }

}
/* 回看（月历/清单）页顶部：本月各周的周复盘状态，点击直接进入那一周 */
function wkMonthBar(y, m){
  var firstStr = ymd(new Date(y, m-1, 1));
  var lastStr  = ymd(new Date(y, m, 0));
  var mon = mondayOf(firstStr), any = false;
  var out = '<div class="wkhist center"><span class="h">周复盘</span>';
  while(mon <= lastStr){
    var sun = shiftDay(mon, 6);
    var rv = S.wk[mon], done = !!(rv && rv.done), recs = weekRecordedDays(mon);
    if(sun >= firstStr && (done || recs > 0)){
      any = true;
      var lbl = (+mon.slice(5,7)) + '/' + (+mon.slice(8,10)) + '–' + (+sun.slice(5,7)) + '/' + (+sun.slice(8,10)) + (done ? ' ✓' : ' ·');
      var tip = dateCN(mon) + ' — ' + dateCN(sun) + (done ? ' 已归档' : ' 有记录 · 未归档');
      out += '<button class="c' + (done?' done':'') + '" title="' + tip + '" onclick="W.gotoWeek(\'' + mon + '\')">' + lbl + '</button>';
    }
    mon = shiftDay(mon, 7);
  }
  return any ? out + '</div>' : '';
}

    if(v && String(v).trim()) add('抽象化' + f.no + '：' + f.label);
  });
  if(cur && !seen[cur]) add(cur);
  var s = '<option value="">（不标注来源）</option>';
  opts.forEach(function(v){ s += '<option value="' + esc(v) + '"' + (cur === v ? ' selected' : '') + '>' + esc(v) + '</option>'; });
  return s;
}
/* 箭头：渲染后按卡片实际坐标绘制 SVG 曲线（随素材列一起滚动） */
function relRect(el, box){
  var r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  return { top:r.top - b.top + box.scrollTop, left:r.left - b.left, w:r.width, h:r.height };
}
function drawWkArrows(){
  var box = document.getElementById('wkmat'), svg = document.getElementById('wkarrows');
  if(!box || !svg) return;
  var r = reviewOf(S.reviewWeek || mondayOf(today()));
  var cs = getComputedStyle(document.documentElement);
  var acc = (cs.getPropertyValue('--acc') || '#A08D4E').trim();
  var surf = (cs.getPropertyValue('--surface') || '#FBFAF6').trim();
  var pos = {};
  [].forEach.call(box.querySelectorAll('.wkcard'), function(c){ pos[c.getAttribute('data-eid')] = c; });
  var H = Math.max(box.scrollHeight, 1), W = Math.max(box.clientWidth, 1);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.height = H + 'px';
  var out = '<defs><marker id="wkah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">'
    + '<path d="M0 0 L8 4 L0 8 z" fill="' + acc + '"/></marker></defs>';
  var n = 0;
  r.links.forEach(function(l, i){
    var ca = pos[l.a], cb = pos[l.b];
    if(!ca || !cb) return;                                  /* 记录已删除则不画 */
    var ra = relRect(ca, box), rb = relRect(cb, box);
    var X = Math.max(ra.left + ra.w, rb.left + rb.w);
    var y1 = ra.top + ra.h / 2, y2 = rb.top + rb.h / 2;
    var bulge = 13 + (n % 3) * 7;
    var dash = l.type === 'indirect' ? '5 4' : (l.type === 'odd' ? '2 3' : '');
    out += '<path d="M' + X + ' ' + y1 + ' C ' + (X + bulge) + ' ' + (y1 + (y2 - y1) * 0.28)
      + ', ' + (X + bulge) + ' ' + (y2 - (y2 - y1) * 0.28) + ', ' + X + ' ' + y2 + '"'
      + ' fill="none" stroke="' + acc + '" stroke-width="1.6" opacity=".8"'
      + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' marker-end="url(#wkah)"/>';
    var mx = X + bulge * 0.75, my = (y1 + y2) / 2;
    out += '<circle class="wkdot" cx="' + mx + '" cy="' + my + '" r="7" fill="' + surf + '" stroke="'
      + acc + '" stroke-width="1.4" onclick="W.wkEditLink(' + i + ')"><title>'
      + (l.cause ? '已写原因，点开查看' : '点开记录联结原因') + '</title></circle>';
    if(l.cause) out += '<circle cx="' + mx + '" cy="' + my + '" r="2.6" fill="' + acc + '" pointer-events="none"/>';
    n++;
  });
  svg.innerHTML = out;
}
